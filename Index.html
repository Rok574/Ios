<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Home"><title>Home Screen</title>
<style>
:root{--sheet:#f2f2f7;--card:#fff;--ink:#111;--dim:#6b7280;--field:#e9e9ee;--blue:#0a84ff;--red:#ff453a;--is:min(16vw,66px);--tint:#0a84ff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sheet:#000;--card:#1c1c1e;--ink:#fff;--dim:#8e8e93;--field:#2c2c2e}}
:root[data-theme="dark"]{--sheet:#000;--card:#1c1c1e;--ink:#fff;--dim:#8e8e93;--field:#2c2c2e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;margin:0;overflow:hidden;background:#000;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Roboto,"Helvetica Neue",sans-serif}
button{font-family:inherit}
#wall{position:fixed;inset:0;transform:scale(1.04);transition:transform .5s cubic-bezier(.2,.8,.2,1)}
#wall.away{transform:scale(1.16)}
#home{position:fixed;inset:0;display:flex;flex-direction:column;color:#fff;transition:transform .42s cubic-bezier(.2,.8,.2,1),filter .42s}
#home.away{transform:scale(1.12);filter:blur(5px)}
.sb{padding:calc(env(safe-area-inset-top,0px) + 14px) 0 0}.sb>*{display:none}
.sb .r{display:flex;gap:6px;align-items:center}
.edtop{display:flex;visibility:hidden;justify-content:space-between;padding:0 16px;height:34px;align-items:center}
.edit .edtop{visibility:visible}
.edtop button{border:0;background:rgba(255,255,255,.25);color:#fff;font-size:15px;font-weight:600;border-radius:16px;padding:6px 14px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
#pv{flex:1;overflow:hidden;touch-action:pan-y}
#track{display:flex;height:100%;will-change:transform}
.slot{display:flex;flex-direction:column;align-items:center;gap:5px;position:relative;align-self:start}
.icon{width:var(--is);height:var(--is);border-radius:22.5%;display:flex;align-items:center;justify-content:center;font-size:calc(var(--is)*.46);font-weight:700;color:#fff;overflow:hidden;position:relative;isolation:isolate;box-shadow:0 1px 6px rgba(0,0,0,.3);transition:transform .15s,filter .15s}
.icon>svg{width:100%;height:100%;display:block}
.slot:active .icon{transform:scale(.88);filter:brightness(.75)}
.cal{background:#fff;flex-direction:column;color:#111;line-height:1}
.cal b{font-size:calc(var(--is)*.19);color:#ff3b30;letter-spacing:.3px;margin-top:3px}.cal i{font-style:normal;font-size:calc(var(--is)*.54);font-weight:300;margin-top:-1px}
.st-dark .icon{filter:brightness(.6) contrast(1.05)}
.st-tint .icon{background:linear-gradient(#34343a,#16161a)!important}
.st-tint .icon>*{filter:grayscale(1) contrast(1.25) brightness(1.3)}
.st-tint .icon::after{content:"";position:absolute;inset:0;background:var(--tint);mix-blend-mode:multiply;pointer-events:none}
.st-tint .cal{color:#fff}.st-tint .cal b{color:#fff}
.label{font-size:11px;font-weight:500;max-width:calc(var(--is) + 14px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px rgba(0,0,0,.55)}
.nolabels .label{display:none}
.edit .slot,.edit .w{animation:jig .26s infinite alternate ease-in-out}
.edit .slot:nth-child(2n){animation-delay:-.13s}
@keyframes jig{from{transform:rotate(-1.6deg)}to{transform:rotate(1.6deg)}}
.del{display:none;position:absolute;top:-6px;left:calc(50% - var(--is)/2 - 6px);width:22px;height:22px;border-radius:50%;background:#8e8e93;color:#fff;font-size:16px;line-height:21px;text-align:center;border:0;padding:0;z-index:3}
.edit .del.ok{display:block}
.w{margin:0;border-radius:24px;overflow:hidden;position:relative;color:#fff;box-shadow:0 3px 12px rgba(0,0,0,.28);background:#3a3a3c center/cover}
.w.m{grid-column:span 4}.w.l{grid-column:span 4;grid-row:span 4}
.w .del{left:8px;top:8px}
.sz{display:none;position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.55);color:#fff;border:0;border-radius:12px;padding:5px 12px;font-size:12px;font-weight:700;z-index:3}
.edit .sz{display:block}
.wb{position:absolute;inset:0;padding:14px;display:flex;flex-direction:column;justify-content:space-between}
.wh{display:flex;justify-content:space-between;align-items:flex-start}
.wc{font-weight:600;font-size:15px}.wt{font-size:44px;font-weight:300;line-height:1.05}
.wd{font-size:13px;font-weight:500;line-height:1.3}
.wdays{display:none;gap:4px;justify-content:space-between}
.wdays div{display:flex;flex-direction:column;align-items:center;font-size:12px;gap:3px;flex:1}
.m .wdays{display:flex}.m .wd{display:none}
.l .wdays{display:flex;flex-direction:column;gap:8px}.l .wdays div{flex-direction:row;justify-content:space-between;font-size:15px}
.l .wdays span:first-child{width:50px}
.pht{margin:auto;font-size:14px;text-align:center;opacity:.8}
.dots{display:flex;justify-content:center;gap:8px;margin:2px 0 8px;min-height:7px}
.dot{width:7px;height:7px;border-radius:50%;border:0;padding:0;background:rgba(255,255,255,.4)}
.dot.on{background:#fff}
.spill{align-self:center;border:0;color:#fff;font-size:13px;font-weight:500;padding:6px 40px;border-radius:16px;background:rgba(255,255,255,.25);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);margin-bottom:12px}
.dock{margin:0 10px 8px;padding:12px 8px;border-radius:32px;background:rgba(255,255,255,.26);backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);display:grid;grid-template-columns:repeat(4,1fr)}
.hi{align-self:center;width:134px;height:5px;border-radius:3px;background:#fff;margin-bottom:calc(env(safe-area-inset-bottom,0px) + 8px)}
#win{position:fixed;display:none;overflow:hidden;z-index:50;transition:all .5s cubic-bezier(.32,.72,0,1)}
.view{position:absolute;inset:0;background:var(--sheet);color:var(--ink);opacity:0;transition:opacity .25s;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 24px) 20px calc(env(safe-area-inset-bottom,0px) + 54px)}
.view.show{opacity:1}
.view h1{margin:6px 0 18px;font-size:32px;letter-spacing:-.5px}
.view h4{margin:22px 0 8px 6px;font-size:12px;color:var(--dim);letter-spacing:.5px;text-transform:uppercase}
.card{background:var(--card);border-radius:14px;overflow:hidden}
.row{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;font-size:16px;border-bottom:.5px solid var(--field);gap:12px}
.row:last-child{border:0}
select,input[type=text],textarea{background:var(--field);color:var(--ink);border:0;border-radius:12px;padding:12px 14px;font-size:16px;outline:none;font-family:inherit;-webkit-user-select:text;user-select:text}
.row input[type=text]{width:55%;text-align:right}
input[type=range]{width:55%}
.sw{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:16px;background:var(--field);position:relative;transition:background .2s;flex:none;border:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3);transition:transform .2s}
.sw:checked{background:#30d158}.sw:checked::after{transform:translateX(20px)}
.wps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px}
.wps button{height:110px;border-radius:12px;border:3px solid transparent;color:#fff;font-weight:600;font-size:12px;text-shadow:0 1px 3px rgba(0,0,0,.6);display:flex;align-items:flex-end;padding:6px}
.wps button.on,.sq.on{border-color:var(--blue)}
.seg{display:flex;gap:8px;padding:12px}
.seg button{flex:1;border:0;border-radius:10px;padding:10px;background:var(--field);color:var(--ink);font-size:15px}
.seg button.on{background:var(--blue);color:#fff}
.sq{width:32px;height:32px;border-radius:50%;border:3px solid transparent;padding:0;box-shadow:0 0 0 1px var(--field) inset}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:600;background:var(--blue);color:#fff;margin-top:12px}
.btn.red{background:var(--red)}.btn.gray{background:var(--field);color:var(--ink)}
#bar{position:absolute;left:0;right:0;bottom:0;height:calc(env(safe-area-inset-bottom,0px) + 36px);z-index:5;touch-action:none;display:flex;align-items:flex-end;justify-content:center;padding-bottom:calc(env(safe-area-inset-bottom,0px)*.4 + 8px)}
#bar::after{content:"";width:134px;height:5px;border-radius:3px;background:var(--ink);opacity:.55}
.hero{display:flex;flex-direction:column;align-items:center;margin-top:12vh;gap:10px;text-align:center}
.hero .icon{--is:92px}
.hero p{color:var(--dim);margin:0;font-size:14px}
.spin{width:26px;height:26px;border:3px solid var(--field);border-top-color:var(--blue);border-radius:50%;animation:sp .8s linear infinite;margin-top:8px}
@keyframes sp{to{transform:rotate(360deg)}}
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
.calc button{aspect-ratio:1;border-radius:50%;border:0;font-size:28px;background:#333;color:#fff}
.calc button.o{background:#ff9f0a}.calc button.f{background:#a5a5a5;color:#000}.calc .z{grid-column:span 2;aspect-ratio:auto;border-radius:40px;text-align:left;padding-left:28px}
.disp{font-size:64px;font-weight:300;text-align:right;margin-top:6vh;overflow:hidden;white-space:nowrap}
.big{font-size:64px;font-weight:200;text-align:center;margin:30px 0 6px;font-variant-numeric:tabular-nums}
.cg{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;gap:8px 0;margin-top:14px}
.cg span{padding:9px 0;border-radius:50%;font-size:16px;width:38px;height:38px;margin:auto}.cg .h{color:var(--dim);font-size:12px}.cg .t{background:var(--red);color:#fff}
textarea{width:100%;height:60vh;resize:none;background:var(--card);line-height:1.45}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:none;align-items:center;justify-content:center;padding:20px;z-index:100}
.box{background:var(--card);color:var(--ink);border-radius:24px;padding:22px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px}
.box h3{margin:0 0 4px}
#lock{position:fixed;inset:0;z-index:200;color:#fff;display:none;flex-direction:column;align-items:center;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
#lock.show{display:flex}#lock.up{transform:translateY(-105%)}
#lbg{position:absolute;inset:0;z-index:-1}
#pad{position:fixed;inset:0;z-index:300;display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;background:rgba(0,0,0,.35);backdrop-filter:blur(40px) saturate(150%);-webkit-backdrop-filter:blur(40px) saturate(150%)}
#pad.show{display:flex}
#pt{font-size:19px;font-weight:500;margin-bottom:22px;text-align:center;padding:0 20px}
#pd{display:flex;gap:18px;margin-bottom:38px}
#pd i{width:13px;height:13px;border-radius:50%;border:1.5px solid #fff}#pd i.f{background:#fff}
#pd.shake{animation:sh .4s}
@keyframes sh{20%{transform:translateX(-14px)}40%{transform:translateX(14px)}60%{transform:translateX(-10px)}80%{transform:translateX(10px)}}
.keys{display:grid;grid-template-columns:repeat(3,min(21vw,80px));gap:16px 22px}
.keys button{width:min(21vw,80px);height:min(21vw,80px);border-radius:50%;border:0;background:rgba(255,255,255,.2);color:#fff;font-size:34px;font-weight:300;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.keys button:active{background:rgba(255,255,255,.55)}
.keys small{font-size:9px;letter-spacing:2px;font-weight:600;margin-top:2px;min-height:10px}
.keys .t{background:none;font-size:17px;font-weight:500}.keys .e{visibility:hidden}
.page{flex:0 0 100%;position:relative;height:100%}
.it,.slot{touch-action:none}
.page .it{position:absolute}
.page .slot.it{padding-top:4px}
.ghost .del,.ghost .sz{display:none!important}
.ghost{filter:drop-shadow(0 8px 14px rgba(0,0,0,.4))}
#bar{transition:opacity .2s;opacity:0}
.wtop{display:flex;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 8px;background:var(--sheet)}
.wtop input{flex:1;min-width:0;text-align:center;font-size:15px;padding:9px 12px}
.wtop button{border:0;background:var(--field);color:var(--ink);border-radius:10px;width:38px;font-size:18px}
.wb2{position:relative;flex:1;min-height:0}
.wf{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.wph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:30px;text-align:center;color:var(--dim);font-size:14px;line-height:1.4;background:var(--sheet)}
#lock{touch-action:none}
#lt{margin-top:calc(env(safe-area-inset-top,0px) + 84px);font-size:84px;font-weight:200;letter-spacing:-2px;line-height:1;text-shadow:0 2px 8px rgba(0,0,0,.25)}
#ld{margin-top:8px;font-size:21px;font-weight:400;text-shadow:0 1px 4px rgba(0,0,0,.3)}
#su{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;flex-direction:column;align-items:center;gap:6px;font-size:15px;font-weight:500;animation:bnc 2.2s ease-in-out infinite}
#su i{width:134px;height:5px;border-radius:3px;background:#fff;margin-top:14px}
@keyframes bnc{0%,60%,100%{transform:none}70%{transform:translateY(-9px)}80%{transform:none}90%{transform:translateY(-5px)}}
.fi{position:absolute;inset:0;width:100%;height:100%;opacity:0;z-index:2}
.pvw{display:flex;gap:12px;justify-content:center;padding:14px;background:#2a2a30;--is:50px}
.hue{-webkit-appearance:none;appearance:none;height:16px;border-radius:8px;width:55%;padding:0}
.hue::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.f3{display:grid;grid-template-columns:repeat(3,1fr);gap:6%;padding:11%;width:100%;height:100%;align-content:center}
.mi{aspect-ratio:1;border-radius:22%;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:#fff;position:relative}.mi>svg{width:100%;height:100%}
#fo{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.35);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);color:#fff}
#fo input{background:none;color:#fff;font-size:26px;font-weight:600;text-align:center;border:0;margin-bottom:18px;outline:none;width:70%;-webkit-user-select:text;user-select:text}
#fp{width:min(88vw,360px);min-height:150px;border-radius:32px;background:rgba(255,255,255,.22);padding:22px 8px;display:grid;grid-template-columns:repeat(4,1fr);gap:16px 0;align-content:start}
.dock{min-height:calc(var(--is) + 44px)}
.dock:empty{background:none;backdrop-filter:none;-webkit-backdrop-filter:none}
.edit .dock:empty{outline:2px dashed rgba(255,255,255,.3);outline-offset:-2px}
#home{transition:transform .5s cubic-bezier(.32,.72,0,1),filter .42s,opacity .35s}
#home.opn{transform:scale(1.12);opacity:0}#wall.opn{transform:scale(1.12)}
.edit .slot,.edit .w{animation-duration:.24s}
.edit .it:nth-child(3n){animation-delay:-.08s}.edit .it:nth-child(3n+1){animation-delay:-.17s}
@keyframes jig{from{transform:rotate(-1.2deg)}to{transform:rotate(1.2deg)}}
.tgt .icon{transform:scale(1.18)!important;box-shadow:0 0 0 3px rgba(255,255,255,.65)}
#fo{animation:fin .2s}@keyframes fin{from{opacity:0}}
#fp{animation:fpop .3s cubic-bezier(.32,.72,0,1)}@keyframes fpop{from{transform:scale(.6);opacity:0}}
#fo input:not([readonly]){border-bottom:1px solid rgba(255,255,255,.5)}
#cs{position:fixed;left:0;right:0;bottom:0;z-index:70;display:none;background:var(--card);color:var(--ink);border-radius:24px 24px 0 0;padding:14px 14px calc(env(safe-area-inset-bottom,0px) + 14px);box-shadow:0 -6px 30px rgba(0,0,0,.4);animation:sup .3s cubic-bezier(.32,.72,0,1)}
@keyframes sup{from{transform:translateY(100%)}}
#cs .row{border:0}
.sb{display:none}
#home{padding-top:calc(env(safe-area-inset-top,0px) + 10px)}
input[type=file]{-webkit-user-select:auto;user-select:auto;cursor:pointer}
.sa .hi,.sa #bar::after{display:none}
html,body{overscroll-behavior:none}
#pv{touch-action:none}
.view{touch-action:pan-y}
#bar{bottom:env(safe-area-inset-bottom,0px);height:40px;padding-bottom:6px}
.fi{-webkit-touch-callout:none}
.dots{display:flex;align-self:center;align-items:center;justify-content:center;height:30px;min-height:0;margin:0 0 4px;padding:0 14px;border-radius:15px}
.dots:not(:empty){background:rgba(0,0,0,.28);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.icon{border-radius:24%}
.page .slot.it{padding-top:0;gap:3px}
.dock{margin:0 11px 8px;padding:10px calc(5.3vw - 11px);border-radius:34px;min-height:calc(var(--is) + 20px)}
.dock .label{display:none}
.fi{pointer-events:none}.edit .fi{pointer-events:auto}
.lib{flex:0 0 100%;height:100%;overflow-y:auto;touch-action:pan-y;padding:6px 18px 24px;backdrop-filter:blur(28px) brightness(.8);-webkit-backdrop-filter:blur(28px) brightness(.8);--is:min(calc((100vw - 52px)/2*.39),70px)}
.lrow{display:flex;gap:10px;align-items:center;margin-bottom:18px}
.lsb{flex:1;min-width:0;background:rgba(255,255,255,.25);color:#fff;border-radius:14px;padding:11px 14px;font-size:17px;border:0;outline:none;-webkit-user-select:text;user-select:text}
.lsb::placeholder{color:rgba(255,255,255,.7)}
.lcx{border:0;background:none;color:#fff;font-size:16px}
.lg{display:grid;grid-template-columns:1fr 1fr;gap:18px 16px}
.lc .bx{background:rgba(255,255,255,.2);border-radius:24px;padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:12px;justify-items:center;align-content:center}
.lc .bx .f3{width:var(--is);height:var(--is);padding:0;gap:6%}
.lc .icon:active{transform:scale(.9)}
.lt2{font-size:12px;text-align:center;margin-top:6px;opacity:.9;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.lh{font-size:13px;font-weight:600;opacity:.7;margin:14px 0 4px}
.lr{display:flex;align-items:center;gap:14px;padding:8px 0;font-size:17px;--is:44px}
#home.inlib .dock,#home.inlib .spill{opacity:0;pointer-events:none}
.dock,.spill{transition:opacity .25s}
</style>
</head>
<body>
<div id="wall"></div>
<div id="home">
  <div class="sb"><span id="clock"></span><span class="r">
    <svg width="18" height="12" viewBox="0 0 18 12" fill="#fff"><rect y="8" width="3" height="4" rx=".8"/><rect x="5" y="5.5" width="3" height="6.5" rx=".8"/><rect x="10" y="3" width="3" height="9" rx=".8"/><rect x="15" width="3" height="12" rx=".8"/></svg>
    <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"><path d="M1.5 4.2a9.5 9.5 0 0113 0M4 7a6 6 0 018 0"/><circle cx="8" cy="10" r="1" fill="#fff" stroke="none"/></svg>
    <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="22" height="12" rx="3.5" fill="none" stroke="#fff" opacity=".5"/><rect id="bl" x="2" y="2" width="19" height="9" rx="2" fill="#fff"/><path d="M24 4.5v4c1-.3 1.7-1.2 1.7-2s-.7-1.7-1.7-2z" fill="#fff" opacity=".5"/></svg>
  </span></div>
  <div class="edtop"><button id="addb">＋</button><button id="cusb">Customize</button><button id="doneb">Done</button></div>
  <div id="pv"><div id="track"></div></div>
  <div class="dots" id="dots"></div>
  <button class="spill" id="spill">Search</button>
  <div class="dock" id="dock"></div>
  <div class="hi"></div>
</div>
<div id="win"><div class="view" id="view"></div><div id="bar"></div></div>
<div class="ov" id="ov"><div class="box" id="ob"></div></div>
<div id="lock"><div id="lbg"></div><div id="lt"></div><div id="ld"></div>
  <div id="su"><svg width="24" height="12" viewBox="0 0 24 12" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-8 9 8"/></svg><span>Swipe up to unlock</span><i></i></div></div>
<div id="pad"><div id="pt"></div><div id="pd"><i></i><i></i><i></i><i></i></div><div class="keys" id="keys"></div></div>
<input type="file" id="file" accept="image/*" style="position:fixed;left:-9999px;opacity:0"><input type="file" id="pfile" accept="image/*" style="position:fixed;left:-9999px;opacity:0">
<script>
const $=s=>document.querySelector(s);

// weather

function fillWx(w){
 const b=w.querySelector('.wb');
 if(!WX){w.style.background=WBG.cloud;b.innerHTML=`<div class="wc">Weather</div><div class="wd">${WXERR?'Unavailable here':'Loading…'}</div>`;return}

 w.style.background=WBG[k];
 b.innerHTML=`<div class="wh"><div><div class="wc">${esc(WX.name)}</div><div class="wt">${WX.t}°</div></div>${wsvg(k,34)}</div><div class="wd">${cond}<br>H:${d[0].hi}° L:${d[0].lo}°</div><div class="wdays">${d.slice(0,5).map(x=>`<div><span>${x.d}</span>${wsvg(wc(x.c)[1],22)}<span>${x.hi}° ${x.lo}°</span></div>`).join('')}</div>`;
}
const paintWx=()=>document.querySelectorAll('.w.wx').forEach(fillWx);
async function loadWx(force){
 try{
  const key=(S.city||'@')+(S.f?'F':'C'),c=JSON.parse(localStorage.getItem('IOS_WX')||'null');
  if(!force&&c&&c.key===key&&Date.now()-c.t<1.2e6){WX=c.d;return paintWx()}
  let lat,lon,name;
  if(S.city){const g=await(await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&name='+encodeURIComponent(S.city))).json();const r=g.results[0];lat=r.latitude;lon=r.longitude;name=r.name}
  else{const p=await new Promise((ok,no)=>navigator.geolocation.getCurrentPosition(ok,no,{timeout:9000}));lat=p.coords.latitude;lon=p.coords.longitude;name='My Location'}
  const j=await(await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&temperature_unit=${S.f?'fahrenheit':'celsius'}`)).json();
  WX={name,t:Math.round(j.current.temperature_2m),c:j.current.weather_code,days:j.daily.time.map((d,i)=>({d:new Date(d+'T12:00').toLocaleDateString([],{weekday:'short'}),c:j.daily.weather_code[i],hi:Math.round(j.daily.temperature_2m_max[i]),lo:Math.round(j.daily.temperature_2m_min[i])}))};
  WXERR=false;try{localStorage.setItem('IOS_WX',JSON.stringify({key,t:Date.now(),d:WX}))}catch(e){}
 }catch(e){WX=null;WXERR=true}
 paintWx();
}
function widget(a){
 const w=el('div','w '+a.size+' '+(a.kind==='weather'?'wx':'ph')),b=el('div','wb');w.appendChild(b);

 else b.innerHTML='<div class="pht">Hold, then tap to add a photo</div>';
 const d=el('button','del ok','−');d.onclick=e=>{e.stopPropagation();rm(a)};

 w.append(d,z);const [gw,gh]=SZ[a.size];w.classList.add('it');Object.assign(w.style,{left:M.pad+a.c*M.cw+(M.cw-M.is)/2+'px',top:a.r*M.rh+'px',width:gw*M.cw-(M.cw-M.is)+'px',height:gh*M.rh-(M.rh-M.is)+'px'});if(a.kind==='photo'){const fi=el('input','fi');fi.type='file';fi.accept='image/*';fi.onclick=e=>{if(moved||lpFired)e.preventDefault()};fi.onchange=e=>shrink(e,1000,d=>{PH[a.id]=d;try{localStorage.setItem('IOS_PW_'+a.id,d)}catch(x){}render()});w.appendChild(fi)}
 bindTap(w,()=>{},a);return w;
}
let M={cw:90,rh:100,rows:6};
const SZ={s:[2,2],m:[4,2],l:[4,4]},dm=a=>a.type==='widget'?SZ[a.size]:[1,1],grid=()=>S.items.filter(a=>!a.dock);
function metrics(){const pv=$('#pv'),W=pv.clientWidth;M.cw=Math.min((W-W*.106)/4,110);M.pad=(W-4*M.cw)/2;M.is=M.cw*(S.big?.786:.66);M.rh=S.big?M.cw:Math.round(M.is+34);M.rows=Math.max(4,Math.floor((pv.clientHeight-4)/M.rh));document.documentElement.style.setProperty('--is',M.is+'px')}
function fits(a,p,c,r){const [w,h]=dm(a);if(c<0||r<0||c+w>4||r+h>M.rows)return false;return !grid().some(b=>{if(b===a||b.p!==p)return false;const [bw,bh]=dm(b);return c<b.c+bw&&b.c<c+w&&r<b.r+bh&&b.r<r+h})}
function autoPlace(a){for(let p=0;p<60;p++)for(let r=0;r<M.rows;r++)for(let c=0;c<4;c++)if(fits(a,p,c,r)){a.p=p;a.c=c;a.r=r;return}}
const pageCount=()=>Math.max(1,...grid().map(a=>a.p+1))+(editing?1:0);
function setWall(){
 const d=S.dim||0,sh=`linear-gradient(rgba(0,0,0,${d}),rgba(0,0,0,${d}))`,v=(S.photo&&photo)?`${sh},url(${photo})`:`${sh},${WP[Math.min(S.wp,WP.length-1)][1]}`;
 [$('#wall'),$('#lbg')].forEach(e=>{e.style.background=v;e.style.backgroundSize='cover';e.style.backgroundPosition='center'});
}
function render(){
 metrics();let ch=0;S.items.forEach(a=>{if(!a.dock&&(a.p==null||!fits(a,a.p,a.c,a.r))){autoPlace(a);ch=1}});if(ch)save();
 const dk=S.items.filter(a=>a.dock).slice(0,4),n=pageCount();
 const lib=(!editing&&S.lib)?1:0;page=Math.max(0,Math.min(page,n-1+lib));
 const t=$('#track');t.innerHTML='';
 for(let p=0;p<n;p++){const pg=el('div','page');grid().filter(a=>a.p===p).forEach(a=>{const x=a.type==='widget'?widget(a):slot(a,true);if(drag&&drag.a===a)x.style.opacity=0;pg.appendChild(x)});t.appendChild(pg)}

 t.style.transition='transform .35s cubic-bezier(.2,.8,.2,1)';t.style.transform=`translateX(${-page*100}%)`;

 const h=$('#home');h.classList.toggle('edit',editing);h.classList.toggle('nolabels',!S.labels||S.big);h.classList.toggle('st-dark',S.style==='dark');h.classList.toggle('st-tint',S.style==='tint');h.dataset.n=n+lib;h.classList.toggle('inlib',!!lib&&page>=n);

$('#pv').addEventListener('pointerdown',e=>{if(editing&&e.target.closest('.it'))return;sx=e.clientX;sy=e.clientY;sw=true;dx=0;moved=false});
function startDrag(a,e){

function dragMove(e){
 const d=drag;d.g.style.left=e.clientX-d.ox+'px';d.g.style.top=e.clientY-d.oy+'px';
 const pr=$('#pv').getBoundingClientRect(),hc=Math.floor((e.clientX-d.ox-pr.left-M.pad+M.cw/2)/M.cw),hr=Math.floor((e.clientY-d.oy-pr.top+M.rh/2)/M.rh);
 const ht=(d.a.type==='widget'||d.a.type==='folder')?null:grid().find(b=>b!==d.a&&b.p===page&&b.type!=='widget'&&b.c===hc&&b.r===hr),hid=ht?ht.id:null;
 if(hid!==d.hov){d.hov=hid;d.hs=Date.now();document.querySelectorAll('.tgt').forEach(n=>n.classList.remove('tgt'));if(ht){const n=document.querySelector(`[data-id="${hid}"]`);if(n)n.classList.add('tgt')}}
 const near=e.clientX<28?-1:e.clientX>innerWidth-28?1:0;

 else if(!near&&edgeT){clearTimeout(edgeT);edgeT=0}
}
function endDrag(e){

 const pv=$('#pv').getBoundingClientRect(),dk=$('#dock').getBoundingClientRect(),cx=e.clientX,cy=e.clientY;
 if(cy>dk.top-10&&a.type!=='widget'&&(a.dock||S.items.filter(x=>x.dock).length<4)){
  const col=Math.max(0,Math.min(3,Math.floor((cx-dk.left)/(dk.width/4))));
  S.items=S.items.filter(x=>x!==a);a.dock=true;const before=S.items.filter(x=>x.dock)[col];
  S.items.splice(before?S.items.indexOf(before):S.items.length,0,a);
 }else{
  const gx=cx-d.ox-pv.left-M.pad+M.cw/2,gy=cy-d.oy-pv.top+M.rh/2,tc=Math.floor(gx/M.cw),tr=Math.floor(gy/M.rh);
  const tg=(a.type==='widget'||a.type==='folder')?null:grid().find(b=>b!==a&&b.p===page&&b.type!=='widget'&&b.c===tc&&b.r===tr);
  if(tg&&d.hov===tg.id&&Date.now()-d.hs>280){S.items=S.items.filter(x=>x!==a);delete a.dock;
   if(tg.type==='folder')tg.items.push(a);
   else{const f={id:uid('f'),type:'folder',name:'Folder',items:[tg,a],p:tg.p,c:tg.c,r:tg.r};S.items[S.items.indexOf(tg)]=f}
   save();render();return}
  const wi=a.type==='widget',[w,h]=dm(a),gl=cx-d.ox-pv.left-M.pad-(wi?(M.cw-M.is)/2:0),gt=cy-d.oy-pv.top;
  const c=Math.max(0,Math.min(4-w,Math.round(gl/M.cw))),r=Math.max(0,Math.min(M.rows-h,Math.round(gt/M.rh))),was=a.dock;
  a.dock=false;
  if(fits(a,page,c,r)){a.p=page;a.c=c;a.r=r}else if(was)autoPlace(a);
 }
 save();render();
}
window.addEventListener('pointermove',e=>{

});

   TINTS.forEach(t=>{const b=el('button','sq'+(S.tint===t?' on':''));b.style.background=t;b.style.flex='none';b.onclick=()=>{S.tint=t;save();render();draw()};sq.appendChild(b)});o.appendChild(sq);
   const sl=(lbl,min,max,val,bg)=>{const r=el('div','row');r.appendChild(el('span',0,lbl));const i=el('input','hue');i.type='range';i.min=min;i.max=max;i.value=val;i.style.background=bg;r.appendChild(i);o.appendChild(r);return i};
   const hr=sl('Color',0,360,S.hue??210,'linear-gradient(90deg,red,yellow,lime,cyan,blue,magenta,red)'),lr=sl('Brightness',20,90,S.lit??55,'linear-gradient(90deg,#000,#888,#fff)');
   const ap=()=>{S.hue=+hr.value;S.lit=+lr.value;S.tint=`hsl(${S.hue} 85% ${S.lit}%)`;document.documentElement.style.setProperty('--tint',S.tint)};
   hr.oninput=lr.oninput=ap;hr.onchange=lr.onchange=save;
  }
  const d=el('button','btn','Done');d.onclick=()=>{o.style.display='none'};o.appendChild(d)};
 draw();o.style.display='block';
}
// passcode
async function hash(c){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('ios:'+c));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return btoa('ios:'+c)}}
const L=['','ABC','DEF','GHI','JKL','MNO','PQRS','TUV','WXYZ'];
let buf='',padFn=null,busy=false;
(function(){const k=$('#keys');[1,2,3,4,5,6,7,8,9,'x',0,'c'].forEach(n=>{
 const b=el('button',n==='x'?'e':n==='c'?'t':'');
 if(typeof n==='number'){b.appendChild(document.createTextNode(n));b.appendChild(el('small',0,n>1?L[n-1]:''));b.onclick=()=>key(String(n))}
 else if(n==='c'){b.id='pc';b.textContent='Cancel';b.onclick=()=>{if(buf){buf='';dots()}else $('#pad').classList.remove('show')}}
 k.appendChild(b)})})();
const dots=()=>{[...$('#pd').children].forEach((d,i)=>d.classList.toggle('f',i<buf.length));$('#pc').textContent=buf?'Delete':'Cancel'};
async function key(d){
 if(busy||buf.length>=4)return;buf+=d;dots();if(buf.length<4)return;
 busy=true;const c=buf;await new Promise(r=>setTimeout(r,120));
 const r=await padFn(c);buf='';busy=false;
 if(r===true){$('#pad').classList.remove('show');dots();return}
 if(typeof r==='string')$('#pt').textContent=r;
 else{$('#pt').textContent='Try Again';const p=$('#pd');p.classList.remove('shake');p.offsetWidth;p.classList.add('shake');if(navigator.vibrate)navigator.vibrate(200)}
 dots();
}
function askPass(title,fn){buf='';padFn=fn;$('#pt').textContent=title;dots();$('#pad').classList.add('show')}
function setPass(done){
 let first=null;
 askPass('Enter a New Passcode',async c=>{
  if(!first){first=c;return'Re-enter your new Passcode'}
  if(c!==first){first=null;return'Passcodes did not match. Try again'}
  S.pass=await hash(c);save();if(done)done();return true});
}
// lock screen with slide to unlock
const lk=$('#lock');
function lockNow(){buf='';$('#pad').classList.remove('show');lk.style.transform='';lk.classList.remove('up');lk.classList.add('show');$('#home').classList.add('away');$('#wall').classList.add('away');tick()}
function unlock(){lk.style.transform='';lk.classList.add('up');$('#home').classList.remove('away');$('#wall').classList.remove('away');setTimeout(()=>lk.classList.remove('show'),500)}
function tryUnlock(){
 if(!S.pass)return unlock();
 askPass('Enter Passcode',async c=>{if((await hash(c))!==S.pass)return false;unlock();return true});
}
(function(){const h=$('#home'),W=$('#wall');let y0=0,t0=0,dy=0,on=false;
 const fx=k=>{h.style.transform=`scale(${1.12-.12*k})`;h.style.filter=`blur(${5*(1-k)}px)`;W.style.transform=`scale(${1.16-.12*k})`};
 lk.onpointerdown=e=>{if($('#pad').classList.contains('show')||e.clientY>innerHeight-22)return;on=true;y0=e.clientY;t0=Date.now();dy=0;lk.setPointerCapture(e.pointerId);lk.style.transition=h.style.transition=W.style.transition='none'};
 lk.onpointermove=e=>{if(!on)return;dy=Math.max(0,y0-e.clientY);lk.style.transform=`translateY(${-dy}px)`;fx(Math.min(1,dy/(innerHeight*.5)))};
 lk.onpointerup=()=>{if(!on)return;on=false;lk.style.transition=h.style.transition=W.style.transition='';
  const go=dy>innerHeight*.22||(dy>50&&dy/(Date.now()-t0)>.5);
  if(go){h.style.transform=h.style.filter=W.style.transform='';tryUnlock();if(S.pass){lk.style.transition='transform .5s cubic-bezier(.3,1.5,.5,1)';lk.style.transform='';setTimeout(()=>lk.style.transition='',520)}}
  else{h.style.transform=h.style.filter=W.style.transform='';lk.style.transition='transform .55s cubic-bezier(.3,1.6,.5,1)';lk.style.transform='';setTimeout(()=>lk.style.transition='',560)}};
 lk.onpointercancel=lk.onpointerup;
})();
// clock + battery
function tick(){
 const d=new Date(),o={hour:'numeric',minute:'2-digit',hour12:!S.h24};
 $('#clock').textContent=d.toLocaleTimeString([],o).replace(/\s?[AP]M/i,'');
 $('#lt').textContent=d.toLocaleTimeString([],o).replace(/\s?[AP]M/i,'');
 $('#ld').textContent=d.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'});
}
setInterval(tick,10000);
try{navigator.getBattery().then(b=>{const u=()=>$('#bl').setAttribute('width',Math.max(2,19*b.level));u();b.onlevelchange=u})}catch(e){}
(function(){const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d'),g=x.createLinearGradient(0,0,0,180);g.addColorStop(0,'#2c5364');g.addColorStop(1,'#0f2027');x.fillStyle=g;x.fillRect(0,0,180,180);
 [[['#ff5f6d','#ffc371'],0,0],[['#56ab2f','#a8e063'],1,0],[['#4776e6','#8e54e9'],0,1],[['#f7971e','#ffd200'],1,1]].forEach(([cs,i,j])=>{const gg=x.createLinearGradient(0,0,0,50);gg.addColorStop(0,cs[0]);gg.addColorStop(1,cs[1]);x.fillStyle=gg;x.beginPath();x.roundRect(28+i*66,28+j*66,58,58,14);x.fill()});
 const u=c.toDataURL('image/png'),l=document.createElement('link');l.rel='apple-touch-icon';l.href=u;document.head.appendChild(l);
 try{const m=document.createElement('link');m.rel='manifest';m.href=URL.createObjectURL(new Blob([JSON.stringify({name:'Home Screen',short_name:'Home',display:'standalone',orientation:'portrait',start_url:location.href.split('#')[0],background_color:'#000000',theme_color:'#000000',icons:[{src:u,sizes:'180x180',type:'image/png'}]})],{type:'application/manifest+json'}));document.head.appendChild(m)}catch(e){}
})();
tick();render();
if(S.items.some(a=>a.kind==='weather'))loadWx();
if(navigator.standalone||matchMedia('(display-mode: standalone)').matches)document.documentElement.classList.add('sa');
if(S.pass||S.lockStart)lockNow();
</script>
