<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Home">
<title>Home Screen</title>
<style>
:root{
  --sheet:#f2f2f7;
  --card:#ffffff;
  --ink:#111111;
  --dim:#6b7280;
  --field:#e9e9ee;
  --blue:#0a84ff;
  --red:#ff453a;
  --is:min(16vw,66px);
  --tint:#0a84ff;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --sheet:#000000;
    --card:#1c1c1e;
    --ink:#ffffff;
    --dim:#8e8e93;
    --field:#2c2c2e;
  }
}
:root[data-theme="dark"]{
  --sheet:#000000;
  --card:#1c1c1e;
  --ink:#ffffff;
  --dim:#8e8e93;
  --field:#2c2c2e;
}
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
}
img,svg{
  pointer-events:none;
  -webkit-user-drag:none;
  user-drag:none;
  -webkit-touch-callout:none;
  -webkit-user-select:none;
  user-select:none;
}
html,body{
  height:100%;
  margin:0;
  overflow:hidden;
  overscroll-behavior:none;
  touch-action:manipulation;
  background:#141418;
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Roboto,"Helvetica Neue",sans-serif;
}
button{font-family:inherit}
input,select,textarea{-webkit-user-select:text;user-select:text;font-family:inherit}
input[type=file]{-webkit-user-select:auto;user-select:auto;cursor:pointer}

#wall{
  position:fixed;inset:-24px;
  transform:scale(1.04);
  transition:transform .5s cubic-bezier(.2,.8,.2,1);
}
#wall.away{transform:scale(1.16)}
#wall.opn{transform:scale(1.12)}

#home{
  position:fixed;inset:0;
  display:flex;flex-direction:column;
  color:#fff;
  padding-top:calc(env(safe-area-inset-top,0px) + 10px);
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 6px);
  transition:transform .5s cubic-bezier(.32,.72,0,1),filter .42s,opacity .35s;
}
#home.away{transform:scale(1.12);filter:blur(5px)}
#home.opn{transform:scale(1.12);opacity:0}

.edtop{
  display:flex;visibility:hidden;
  justify-content:space-between;align-items:center;
  padding:0 16px;height:36px;flex:none;
}
.edit .edtop{visibility:visible}
.edtop button{
  border:0;background:rgba(255,255,255,.25);color:#fff;
  font-size:15px;font-weight:600;border-radius:16px;
  padding:6px 14px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}

#pv{flex:1;min-height:0;overflow:hidden;touch-action:none;position:relative}
#track{display:flex;height:100%;will-change:transform}
.page{flex:0 0 100%;position:relative;height:100%}

/* Slots & App Store-style Icons */
.slot{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  position:relative;touch-action:none;
}
.page>.it{position:absolute!important}
.page .slot.it{padding-top:0}
.icon{
  width:var(--is);height:var(--is);
  border-radius:22.5%;
  display:flex;align-items:center;justify-content:center;
  font-size:calc(var(--is)*.46);font-weight:700;color:#fff;
  overflow:hidden;position:relative;isolation:isolate;
  box-shadow:0 3px 10px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.32);
  transition:transform .15s,filter .15s;
}
/* Subtle App Store glossy top highlight */
.icon::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(255,255,255,.22) 0%,rgba(255,255,255,0) 48%);
  pointer-events:none;z-index:2;
}
.icon>svg{width:100%;height:100%;display:block;position:relative;z-index:1}
.icon>img.full-ico{width:100%;height:100%;object-fit:cover;display:block;position:relative;z-index:1}
.icon>img.fav-ico{width:64%;height:64%;object-fit:contain;border-radius:18%;display:block;position:relative;z-index:1}
.slot:active .icon{transform:scale(.88);filter:brightness(.78)}

.cal{background:#fff;flex-direction:column;color:#111;line-height:1}
.cal::before{display:none}
.cal b{font-size:calc(var(--is)*.19);color:#ff3b30;letter-spacing:.3px;margin-top:3px;z-index:1}
.cal i{font-style:normal;font-size:calc(var(--is)*.54);font-weight:300;margin-top:-1px;z-index:1}

.st-dark .icon{filter:brightness(.62) contrast(1.05)}
.st-tint .icon:not(.fld-ico){background:linear-gradient(180deg,#2c2c30,#141416)!important}
.st-tint .icon:not(.fld-ico)>*{filter:grayscale(1) contrast(1.35) brightness(1.18)}
.st-tint .icon:not(.fld-ico)::after{
  content:"";position:absolute;inset:0;
  background:var(--tint);mix-blend-mode:multiply;
  pointer-events:none;z-index:3;
}
.st-tint .mi{background:linear-gradient(180deg,#2c2c30,#141416)!important}
.st-tint .mi>*{filter:grayscale(1) contrast(1.35) brightness(1.18)}
.st-tint .mi::after{
  content:"";position:absolute;inset:0;
  background:var(--tint);mix-blend-mode:multiply;
  pointer-events:none;z-index:3;
}
.st-tint .cal{color:#fff}.st-tint .cal b{color:#fff}

.label{
  font-size:11px;font-weight:500;
  max-width:calc(var(--is) + 14px);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-shadow:0 1px 3px rgba(0,0,0,.6);
}
.nolabels .label{display:none}

.edit .slot,.edit .w{animation:jig .24s infinite alternate ease-in-out}
.edit .slot:nth-child(2n){animation-delay:-.12s}
.edit .it:nth-child(3n){animation-delay:-.08s}
.edit .it:nth-child(3n+1){animation-delay:-.17s}
@keyframes jig{from{transform:rotate(-1.2deg)}to{transform:rotate(1.2deg)}}

.del{
  display:none;position:absolute;
  top:-6px;left:calc(50% - var(--is)/2 - 6px);
  width:22px;height:22px;border-radius:50%;
  background:#8e8e93;color:#fff;font-size:16px;line-height:21px;
  text-align:center;border:0;padding:0;z-index:5;
  box-shadow:0 2px 5px rgba(0,0,0,.35);
}
.edit .del.ok{display:block}

/* Widgets */
.w{
  margin:0;border-radius:24px;overflow:hidden;position:relative;
  color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.3);
  background:#3a3a3c center/cover;touch-action:none;
}
.w .del{left:8px;top:8px}
.sz{
  display:none;position:absolute;right:8px;bottom:8px;
  background:rgba(0,0,0,.58);color:#fff;border:0;border-radius:12px;
  padding:5px 12px;font-size:12px;font-weight:700;z-index:5;
}
.edit .sz{display:block}
.wb{position:absolute;inset:0;padding:10px 11px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.wh{display:flex;justify-content:space-between;align-items:flex-start;gap:4px;min-width:0}
.wh>div{min-width:0;flex:1}
.wc{font-weight:600;font-size:clamp(12px,3.4vw,15px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wt{font-size:clamp(32px,9vw,44px);font-weight:300;line-height:1.05}
.wd{font-size:12px;font-weight:500;line-height:1.25;overflow:hidden}
.wdays{display:none;gap:4px;justify-content:space-between}
.wdays div{display:flex;flex-direction:column;align-items:center;font-size:12px;gap:3px;flex:1}
.m .wdays{display:flex}.m .wd{display:none}
.l .wdays{display:flex;flex-direction:column;gap:8px}
.l .wdays div{flex-direction:row;justify-content:space-between;font-size:15px}
.l .wdays span:first-child{width:50px}
.pht{margin:auto;font-size:14px;text-align:center;opacity:.85}

/* Dots, Search Pill, Dock (NO Home Bar!) */
.dots{
  display:flex;align-self:center;align-items:center;justify-content:center;
  gap:8px;height:28px;min-height:0;margin:2px 0 6px;padding:0 14px;border-radius:14px;
  flex:none;
}
.dots:not(:empty){
  background:rgba(0,0,0,.28);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.dot{width:7px;height:7px;border-radius:50%;border:0;padding:0;background:rgba(255,255,255,.4)}
.dot.on{background:#fff}

.spill{
  align-self:center;border:0;color:#fff;font-size:13px;font-weight:500;
  padding:6px 40px;border-radius:16px;
  background:rgba(255,255,255,.25);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  margin-bottom:10px;flex:none;
}
.dock{
  margin:0 11px 4px;
  padding:10px calc(5.3vw - 11px);
  border-radius:34px;
  background:rgba(255,255,255,.26);
  backdrop-filter:blur(26px) saturate(170%);
  -webkit-backdrop-filter:blur(26px) saturate(170%);
  display:grid;grid-template-columns:repeat(4,1fr);
  justify-items:center;align-items:center;
  min-height:calc(var(--is) + 20px);
  flex:none;
}
.dock .label{display:none}
.dock:empty{background:none;backdrop-filter:none;-webkit-backdrop-filter:none}
.edit .dock:empty{outline:2px dashed rgba(255,255,255,.3);outline-offset:-2px}

/* App Window & Invisible Bottom Edge Swipe Zone (no visual home bar) */
#win{
  position:fixed;inset:0;width:100%;height:100dvh;display:none;overflow:hidden;z-index:50;
  transition:all .46s cubic-bezier(.32,.72,0,1);
}
.view{
  position:absolute;inset:0;
  background:var(--sheet);color:var(--ink);
  opacity:0;transition:opacity .22s;
  overflow-y:auto;touch-action:pan-y;
  padding:calc(env(safe-area-inset-top,0px) + 22px) 20px calc(env(safe-area-inset-bottom,0px) + 28px);
}
.view.show{opacity:1}
.view h1{margin:6px 0 18px;font-size:32px;letter-spacing:-.5px}
.view h4{margin:22px 0 8px 6px;font-size:12px;color:var(--dim);letter-spacing:.5px;text-transform:uppercase}
.card{background:var(--card);border-radius:14px;overflow:hidden}
.row{
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 16px;font-size:16px;border-bottom:.5px solid var(--field);gap:12px;
}
.row:last-child{border:0}
select,input[type=text],textarea{
  background:var(--field);color:var(--ink);border:0;
  border-radius:12px;padding:12px 14px;font-size:16px;outline:none;
}
.row input[type=text]{width:55%;text-align:right}
input[type=range]{width:55%}
.sw{
  appearance:none;-webkit-appearance:none;width:51px;height:31px;
  border-radius:16px;background:var(--field);position:relative;
  transition:background .2s;flex:none;border:0;
}
.sw::after{
  content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;
  border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3);
  transition:transform .2s;
}
.sw:checked{background:#30d158}.sw:checked::after{transform:translateX(20px)}
.wps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px}
.wps button{
  height:110px;border-radius:12px;border:3px solid transparent;
  color:#fff;font-weight:600;font-size:12px;text-shadow:0 1px 3px rgba(0,0,0,.6);
  display:flex;align-items:flex-end;padding:6px;
}
.wps button.on,.sq.on{border-color:var(--blue)}
.seg{display:flex;gap:8px;padding:12px}
.seg button{flex:1;border:0;border-radius:10px;padding:10px;background:var(--field);color:var(--ink);font-size:15px}
.seg button.on{background:var(--blue);color:#fff}
.sq{width:32px;height:32px;border-radius:50%;border:3px solid transparent;padding:0;box-shadow:0 0 0 1px var(--field) inset}
.btn{
  display:block;width:100%;border:0;border-radius:14px;padding:15px;
  font-size:17px;font-weight:600;background:var(--blue);color:#fff;margin-top:12px;
}
.btn.red{background:var(--red)}.btn.gray{background:var(--field);color:var(--ink)}

/* Compact bottom Home button pill for system apps only */
#bar{
  position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);
  transform:translateX(-50%);
  width:96px;height:32px;border-radius:16px;
  background:rgba(120,120,128,.34);
  border:1px solid rgba(255,255,255,.22);
  backdrop-filter:blur(16px) saturate(150%);
  -webkit-backdrop-filter:blur(16px) saturate(150%);
  box-shadow:0 3px 10px rgba(0,0,0,.22);
  display:none;align-items:center;justify-content:center;
  color:#fff;font-size:12px;font-weight:600;letter-spacing:.2px;
  cursor:pointer;z-index:12;touch-action:none;
  transition:transform .16s ease,background .16s ease,opacity .2s ease;
}
#win.sys-open #bar{display:flex}
#bar:active{transform:translateX(-50%) scale(.92);background:rgba(120,120,128,.55)}

/* Full-Screen Website App Launch Splash */
.blank-app{
  position:absolute;inset:0;width:100%;height:100%;overflow:hidden;
  background:var(--sheet);color:#fff;
}
.blank-app .fs-img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;display:block;
}
.blank-app .fs-grad{
  position:absolute;inset:0;
}
.blank-app .fs-status{
  position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);
  display:flex;flex-direction:column;align-items:center;gap:10px;
  padding:0 20px;text-align:center;
  font-size:14px;font-weight:500;color:#fff;
  text-shadow:0 1px 6px rgba(0,0,0,.65);
}

.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
.calc button{aspect-ratio:1;border-radius:50%;border:0;font-size:28px;background:#333;color:#fff}
.calc button.o{background:#ff9f0a}.calc button.f{background:#a5a5a5;color:#000}
.calc .z{grid-column:span 2;aspect-ratio:auto;border-radius:40px;text-align:left;padding-left:28px}
.disp{font-size:64px;font-weight:300;text-align:right;margin-top:6vh;overflow:hidden;white-space:nowrap}
.big{font-size:64px;font-weight:200;text-align:center;margin:30px 0 6px;font-variant-numeric:tabular-nums}
.cg{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;gap:8px 0;margin-top:14px}
.cg span{padding:9px 0;border-radius:50%;font-size:16px;width:38px;height:38px;margin:auto}
.cg .h{color:var(--dim);font-size:12px}.cg .t{background:var(--red);color:#fff}
textarea{width:100%;height:60vh;resize:none;background:var(--card);line-height:1.45}

/* Overlays, Lock Screen, Passcode, Folder */
.ov{
  position:fixed;inset:0;background:rgba(0,0,0,.55);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  display:none;align-items:center;justify-content:center;padding:20px;z-index:100;
}
.box{
  background:var(--card);color:var(--ink);border-radius:24px;
  padding:22px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px;
}
.box h3{margin:0 0 4px}

#lock{
  position:fixed;inset:0;z-index:200;color:#fff;
  display:none;flex-direction:column;align-items:center;
  opacity:1;transform:translateY(0) scale(1);
  transition:transform .52s cubic-bezier(.22,1,.36,1),opacity .42s ease;
  touch-action:none;will-change:transform,opacity;
}
#lock.show{display:flex}
#lock.up{transform:translateY(-100%) scale(1.03);opacity:0}
#lbg{position:absolute;inset:0;z-index:-1}
#lt{margin-top:calc(env(safe-area-inset-top,0px) + 84px);font-size:84px;font-weight:200;letter-spacing:-2px;line-height:1;text-shadow:0 2px 10px rgba(0,0,0,.28);transition:transform .42s cubic-bezier(.22,1,.36,1),opacity .35s ease}
#ld{margin-top:8px;font-size:21px;font-weight:400;text-shadow:0 1px 6px rgba(0,0,0,.35);transition:transform .42s cubic-bezier(.22,1,.36,1),opacity .35s ease}
#lock.up #lt,#lock.up #ld{transform:translateY(-24px);opacity:0}
#su{
  position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);
  display:flex;flex-direction:column;align-items:center;gap:6px;
  font-size:15px;font-weight:500;animation:bnc 2.2s ease-in-out infinite;
  pointer-events:none;transition:opacity .25s ease;
}
#lock.up #su{opacity:0;animation:none}
@keyframes bnc{0%,60%,100%{transform:none}70%{transform:translateY(-9px)}80%{transform:none}90%{transform:translateY(-5px)}}

#pad{
  position:fixed;inset:0;z-index:300;display:none;flex-direction:column;
  align-items:center;justify-content:center;color:#fff;
  background:rgba(0,0,0,.35);backdrop-filter:blur(40px) saturate(150%);-webkit-backdrop-filter:blur(40px) saturate(150%);
}
#pad.show{display:flex}
#pt{font-size:19px;font-weight:500;margin-bottom:22px;text-align:center;padding:0 20px}
#pd{display:flex;gap:18px;margin-bottom:38px}
#pd i{width:13px;height:13px;border-radius:50%;border:1.5px solid #fff}#pd i.f{background:#fff}
#pd.shake{animation:sh .4s}
@keyframes sh{20%{transform:translateX(-14px)}40%{transform:translateX(14px)}60%{transform:translateX(-10px)}80%{transform:translateX(10px)}}
.keys{display:grid;grid-template-columns:repeat(3,min(21vw,80px));gap:16px 22px}
.keys button{width:min(21vw,80px);height:min(21vw,80px);border-radius:50%;border:0;background:rgba(255,255,255,.2);color:#fff;font-size:34px;font-weight:300;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.keys button:active{background:rgba(255,255,255,.55)}
.keys small{font-size:9px;letter-spacing:2px;font-weight:600;margin-top:2px;min-height:10px}
.keys .t{background:none;font-size:17px;font-weight:500}.keys .e{visibility:hidden}

.ghost .del,.ghost .sz{display:none!important}
.ghost{filter:drop-shadow(0 8px 14px rgba(0,0,0,.4))}
.wtop{display:flex;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 8px;background:var(--sheet)}
.wtop input{flex:1;min-width:0;text-align:center;font-size:15px;padding:9px 12px}
.wtop button{border:0;background:var(--field);color:var(--ink);border-radius:10px;width:38px;font-size:18px}
.wb2{position:relative;flex:1;min-height:0}
.wf{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.wph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:30px;text-align:center;color:var(--dim);font-size:14px;line-height:1.4;background:var(--sheet)}

.fi{position:absolute;inset:0;width:100%;height:100%;opacity:0;z-index:4;pointer-events:none;-webkit-touch-callout:none}
.edit .fi{pointer-events:auto}
.pvw{display:flex;gap:12px;justify-content:center;padding:14px;background:#2a2a30;--is:50px}
.hue{-webkit-appearance:none;appearance:none;height:16px;border-radius:8px;width:55%;padding:0}
.hue::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}

/* Folder mini-grid & iOS Open Folder Modal */
.f3{
  display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
  gap:5%;padding:11%;width:100%;height:100%;
  position:relative;z-index:1;
}
.mi{
  width:100%;height:100%;border-radius:26%;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  font-size:7px;font-weight:700;color:#fff;position:relative;
  box-shadow:0 1px 2px rgba(0,0,0,.24);
}
.mi>svg,.mi>img.full-ico{width:100%;height:100%;object-fit:cover;display:block}
.mi>img.fav-ico{width:66%;height:66%;object-fit:contain;border-radius:18%;display:block}

#fo{
  position:fixed;inset:0;z-index:80;display:none;flex-direction:column;
  align-items:center;justify-content:center;padding:24px;
  background:rgba(12,12,16,.44);
  backdrop-filter:blur(28px) saturate(160%);-webkit-backdrop-filter:blur(28px) saturate(160%);
  color:#fff;animation:fin .2s ease;
}
@keyframes fin{from{opacity:0}}
#fo input{
  background:none;color:#fff;font-size:24px;font-weight:600;
  letter-spacing:-.3px;text-align:center;border:0;
  border-bottom:1.5px solid transparent;padding:4px 10px;
  margin-bottom:18px;outline:none;width:min(76vw,300px);
}
#fo input:not([readonly]){border-bottom-color:rgba(255,255,255,.55)}
#fp{
  width:min(86vw,340px);min-height:220px;border-radius:36px;
  background:rgba(255,255,255,.22);
  border:1px solid rgba(255,255,255,.18);
  box-shadow:0 18px 45px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.28);
  padding:22px 12px 24px;
  display:grid;grid-template-columns:repeat(3,1fr);gap:18px 8px;
  align-content:start;justify-items:center;
  animation:fpop .28s cubic-bezier(.32,.72,0,1);
}
@keyframes fpop{from{transform:scale(.75);opacity:0}}
.tgt .icon{transform:scale(1.18)!important;box-shadow:0 0 0 3px rgba(255,255,255,.65)}

#cs{

<script>
const $=s=>document.querySelector(s);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const WP=[
  ['Dusk','linear-gradient(180deg,#2b3a67,#6d5a9c 55%,#f0a1a1)'],

  ['Midnight','linear-gradient(180deg,#090d16,#162238 60%,#1e3a5f)'],
  ['Ocean','linear-gradient(180deg,#0575e6,#021b79)']
];
const TINTS=['#0a84ff','#ff375f','#30d158','#ff9f0a','#bf5af2','#ffffff'];
const hue=s=>[...String(s||'app')].reduce((h,c)=>(h*31+c.charCodeAt(0))%360,7);
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const mk=(name,url,icon)=>({id:uid('a'),name,url,icon:icon||'',type:'url',hue:hue(name)});
const sys=(id,name,dock)=>({id,name,type:id,hue:210,dock:!!dock});
const wd=(kind,size)=>({id:uid('w'),type:'widget',kind,size});

const DEF=()=>({
  wp:0,photo:false,dim:.1,engine:'duck',lockStart:true,big:true,lib:true,
  proxy:'',h24:false,labels:true,pass:null,notes:'',style:'default',
  tint:'#0a84ff',hue:210,lit:55,city:'',openMode:'auto',
  f:/en-us/i.test(navigator.language),
  items:[sys('safari','Safari',1),sys('settings','Settings',1)]
});

let S;
try{
  S=JSON.parse(localStorage.getItem('IOS_HOME3')||'null');
  if(!S){
    S=JSON.parse(localStorage.getItem('IOS_HOME2')||'null');
    if(S){delete S.items;S.engine='duck'}
  }
}catch(e){}
S=Object.assign(DEF(),S||{});
if(!Array.isArray(S.items))S.items=[sys('safari','Safari',1),sys('settings','Settings',1)];

/* Sanitize corrupted folders; drop removed widgets (notes / countdown / stopwatch) */
S.items=S.items.filter(Boolean).filter(a=>!(a.type==='widget'&&['notes','countdown','stopwatch'].includes(a.kind))).map(a=>{
  if(a.name&&a.name.trim().toLowerCase()==='settings'&&!a.url){
    a.type='settings';
  }
  if(a.type==='folder'){
    a.items=(Array.isArray(a.items)?a.items:[]).filter(x=>x&&x.type!=='folder'&&x.type!=='widget');
  }
  return a;
}).filter(a=>a.type!=='folder'||a.items.length>0);

let photo='';
try{photo=localStorage.getItem('IOS_WP')||''}catch(e){}
const PH={};
S.items.forEach(a=>{
  if(a.kind==='photo')try{PH[a.id]=localStorage.getItem('IOS_PW_'+a.id)||''}catch(e){}
});
const save=()=>{try{localStorage.setItem('IOS_HOME3',JSON.stringify(S))}catch(e){}};

let page=0,editing=false,moved=false,lpFired=false,lp=null;
let openRect=null,pendingWeb=false,webLaunchTime=0,hiddenAt=0,swInt=0,pickId=null,WX=null,WXERR=false,launchSeq=0;

const bg=a=>`linear-gradient(155deg,hsl(${a.hue??hue(a.name)} 82% 58%),hsl(${((a.hue??hue(a.name))+32)%360} 72% 40%))`;
const G=(b,s)=>({b,s});

/* App Store-style vector icons */
const ART={
  safari:G(
    'linear-gradient(180deg,#52aeff 0%,#0f66dc 100%)',
    `<svg viewBox="0 0 120 120">
      <defs>
        <radialGradient id="sd" cx="50%" cy="45%" r="55%">

          <stop offset="85%" stop-color="#e7f2ff"/>

      <g stroke="#2979e6" stroke-width="2" stroke-linecap="round" opacity=".6">
        <line x1="60" y1="18" x2="60" y2="25"/><line x1="60" y1="95" x2="60" y2="102"/>
        <line x1="18" y1="60" x2="25" y2="60"/><line x1="95" y1="60" x2="102" y2="60"/>
      </g>

  ),

    'linear-gradient(180deg,#a2a7b0 0%,#5c6068 100%)',
    `<svg viewBox="0 0 120 120">

      <rect width="120" height="34" fill="#ffd60a"/>

      <path d="M0 56h120M0 76h120M0 96h120" stroke="#d1d1d6" stroke-width="2.2"/>
    </svg>`
  ),
  calc:G(
    'linear-gradient(180deg,#2c2c2e 0%,#141416 100%)',
    `<svg viewBox="0 0 120 120">
      <rect x="18" y="18" width="38" height="38" rx="11" fill="#b4b4ba"/>
      <rect x="64" y="18" width="38" height="38" rx="11" fill="#636369"/>
      <rect x="18" y="64" width="38" height="38" rx="11" fill="#636369"/>
      <rect x="64" y="64" width="38" height="38" rx="11" fill="#ff9f0a"/>

  )

/* App Store + Multi-Source Icon Getter */
const appStoreArtCache=new Map();
function fetchAppStoreArtwork(term, host, cb){
  const key=(term||host||'').toLowerCase();
  if(!key)return;
  if(appStoreArtCache.has(key)){
    const v=appStoreArtCache.get(key);
    if(v)cb(v);
    return;
  }
  const cleanHost=(host||'').replace(/^www\./,'').split('.')[0];
  const query=encodeURIComponent(term||cleanHost);
  fetch(`https://itunes.apple.com/search?term=${query}&entity=software&limit=5`)
    .then(r=>r.json())
    .then(data=>{
      const list=data&&Array.isArray(data.results)?data.results:[];
      const match=list.find(item=>{
        const seller=(item.sellerUrl||'').toLowerCase();
        const track=(item.trackName||'').toLowerCase();
        return (cleanHost&&seller.includes(cleanHost))||(cleanHost&&track.includes(cleanHost))||(term&&track.includes(term.toLowerCase()));
      })||list[0];
      const art=match&&(match.artworkUrl512||match.artworkUrl100);
      if(art){
        const hiRes=art.replace(/100x100bb/,'256x256bb');
        appStoreArtCache.set(key,hiRes);
        cb(hiRes);
      }else{
        appStoreArtCache.set(key,null);
      }
    })
    .catch(()=>{appStoreArtCache.set(key,null)});
}

function attachWebIcon(container, a){
  if(!a)return;
  if(a.icon){
    const im=new Image();
    im.draggable=false;
    im.onload=()=>{
      if(!container.isConnected)return;
      container.dataset.hasAppStore='1';
      container.dataset.resolvedIcon=a.icon;
      container.classList.add('has-full');
      container.innerHTML='';
      container.style.background=S.style==='tint'?'':'#1c1c1e';
      im.className='full-ico';
      container.appendChild(im);
    };
    im.src=a.icon;
    return;
  }
  if(!a.url)return;
  let host='';
  try{host=new URL(a.url).hostname}catch(e){return}
  if(!host)return;

  const sources=[
    `https://www.google.com/s2/favicons?sz=256&domain=${encodeURIComponent(host)}`,
    `https://icons.duckduckgo.com/ip3/${encodeURIComponent(host)}.ico`,
    `https://${host}/apple-touch-icon.png`
  ];
  let idx=0;
  const tryFav=()=>{
    if(idx>=sources.length)return;
    const src=sources[idx++];
    const im=new Image();
    im.draggable=false;
    im.onload=()=>{
      if(!container.isConnected||container.dataset.hasAppStore==='1')return;
      if(im.naturalWidth>=16){
        container.innerHTML='';
        container.style.background=S.style==='tint'?'':'#ffffff';
        im.className='fav-ico';
        container.appendChild(im);
      }else{
        tryFav();
      }
    };
    im.onerror=tryFav;
    im.src=src;
  };
  tryFav();

  fetchAppStoreArtwork(a.name, host, artUrl=>{
    if(!container.isConnected)return;
    const im=new Image();
    im.draggable=false;
    im.onload=()=>{
      if(!container.isConnected)return;
      container.dataset.hasAppStore='1';
      container.dataset.resolvedIcon=artUrl;
      container.classList.add('has-full');
      container.innerHTML='';
      container.style.background=S.style==='tint'?'':'#1c1c1e';
      im.className='full-ico';
      container.appendChild(im);
    };
    im.src=artUrl;
  });
}

function fillIcon(i,a){
  i.innerHTML='';
  i.classList.remove('cal','fld-ico','has-full');
  delete i.dataset.hasAppStore;
  delete i.dataset.resolvedIcon;
  i.style.background='';
  if(!a)return;
  if(a.type==='calendar'){
    i.classList.add('cal');
    const d=new Date();
    i.appendChild(el('b',0,d.toLocaleDateString([],{weekday:'short'}).toUpperCase()));
    i.appendChild(el('i',0,d.getDate()));
    return;
  }
  if(a.type==='folder'){
    i.classList.add('fld-ico');
    i.style.background='rgba(255,255,255,.22)';
    i.style.backdropFilter='blur(18px) saturate(150%)';
    i.style.webkitBackdropFilter='blur(18px) saturate(150%)';
    const g=el('div','f3');
    (a.items||[]).slice(0,9).forEach(x=>{
      const m=el('div','mi');
      fillIcon(m,x);
      g.appendChild(m);
    });
    i.appendChild(g);
    return;
  }
  const r=ART[a.type];
  if(r){
    i.style.background=r.b;
    i.innerHTML=r.s;
    return;
  }
  i.style.background=bg(a);
  const letter=el('span',0,(a.name||'?').trim()[0].toUpperCase());
  letter.style.position='relative';
  letter.style.zIndex='1';
  i.appendChild(letter);
  attachWebIcon(i,a);
}

const allApps=()=>{
  const r=[];
  S.items.forEach(a=>{
    if(!a||a.type==='widget')return;
    if(a.type==='folder')(a.items||[]).forEach(x=>{if(x)r.push({a:x,cat:a.name||'Folder'})});
    else r.push({a,cat:(a.type==='url')?'Websites':'Utilities'});
  });
  return r;
};

function libPage(){
  const pg=el('div','lib'),top=el('div','lrow'),q=el('input','lsb'),cx=el('button','lcx','Cancel'),body=el('div');
  q.type='text';q.placeholder='App Library';q.autocomplete='off';q.setAttribute('inputmode','search');
  cx.style.display='none';top.append(q,cx);pg.append(top,body);
  const apps=allApps();let list=false;
  const draw=()=>{
    body.innerHTML='';
    const t=q.value.trim().toLowerCase();
    cx.style.display=list?'block':'none';
    if(list||t){
      let L=apps.filter(x=>x.a.name.toLowerCase().includes(t)).sort((x,y)=>x.a.name.localeCompare(y.a.name)),last='';
      if(!L.length)body.appendChild(el('div','lt2','No Results'));
      L.forEach(({a})=>{
        const c=(a.name||'?')[0].toUpperCase();
        if(c!==last){last=c;body.appendChild(el('div','lh',c))}
        const r=el('div','lr'),ic=el('div','icon');fillIcon(ic,a);
        r.append(ic,el('span',0,a.name));
        r.onclick=()=>{if(!moved)launch(a,ic)};
        body.appendChild(r);
      });
      return;
    }
    const g=el('div','lg'),cats=new Map();
    apps.forEach(({a,cat})=>{if(!cats.has(cat))cats.set(cat,[]);cats.get(cat).push(a)});
    if(!cats.size)g.appendChild(el('div','lt2','No apps yet'));
    cats.forEach((l,name)=>{
      const c=el('div','lc'),bx=el('div','bx');
      l.slice(0,4).forEach((a,k)=>{
        if(k===3&&l.length>4){
          const m=el('div','f3');
          l.slice(3,7).forEach(x=>{const mi=el('div','mi');fillIcon(mi,x);m.appendChild(mi)});
          bx.appendChild(m);
        }else{
          const ic=el('div','icon');fillIcon(ic,a);
          ic.onclick=()=>{if(!moved)launch(a,ic)};
          bx.appendChild(ic);
        }
      });
      c.append(bx,el('div','lt2',name));g.appendChild(c);
    });
    body.appendChild(g);
  };
  q.onfocus=()=>{list=true;draw()};
  q.oninput=draw;
  cx.onclick=()=>{q.value='';q.blur();list=false;draw()};
  draw();
  return pg;
}

/* Slot layout & grid placement */
let M={cw:90,rh:100,rows:6,pad:8,is:64};
const SZ={s:[2,2],m:[4,2],l:[4,4]};
const dm=a=>a.type==='widget'?SZ[a.size||'s']:[1,1];
const grid=()=>S.items.filter(a=>a&&!a.dock);

function metrics(){
  const pv=$('#pv');
  const W=pv.clientWidth||innerWidth;
  const H=pv.clientHeight||(innerHeight-180);
  M.cw=Math.min(Math.max((W-W*.106)/4,56),110);
  M.pad=Math.max(6,(W-4*M.cw)/2);
  M.is=Math.round(M.cw*(S.big?.786:.66));
  M.rh=S.big?Math.round(M.cw):Math.round(M.is+32);
  M.rows=Math.max(4,Math.floor((H-4)/M.rh));
  document.documentElement.style.setProperty('--is',M.is+'px');
}

function fits(a,p,c,r){
  const [w,h]=dm(a);
  if(p<0||c<0||r<0||c+w>4||r+h>M.rows)return false;
  return !grid().some(b=>{
    if(b===a||b.p!==p)return false;
    const [bw,bh]=dm(b);
    return c<b.c+bw&&b.c<c+w&&r<b.r+bh&&b.r<r+h;
  });
}

function autoPlace(a,from){
  for(let p=from||0;p<60;p++)
    for(let r=0;r<M.rows;r++)
      for(let c=0;c<4;c++)
        if(fits(a,p,c,r)){a.p=p;a.c=c;a.r=r;return}
  for(let p=0;p<(from||0);p++)
    for(let r=0;r<M.rows;r++)
      for(let c=0;c<4;c++)
        if(fits(a,p,c,r)){a.p=p;a.c=c;a.r=r;return}
  a.p=0;a.c=0;a.r=0;
}

const pageCount=()=>Math.max(1,...grid().map(a=>(a.p||0)+1))+(editing?1:0);

function setWall(){
  const d=S.dim||0;
  const sh=`linear-gradient(rgba(0,0,0,${d}),rgba(0,0,0,${d}))`;
  const v=(S.photo&&photo)?`${sh},url(${photo})`:`${sh},${WP[Math.min(S.wp||0,WP.length-1)][1]}`;
  [$('#wall'),$('#lbg')].forEach(e=>{
    e.style.background=v;
    e.style.backgroundSize='cover';
    e.style.backgroundPosition='center';
  });
}

function render(){
  metrics();
  let ch=0;
  S.items.forEach(a=>{
    if(a&&!a.dock&&(a.p==null||a.c==null||a.r==null||!fits(a,a.p,a.c,a.r))){
      autoPlace(a,a.p||0);ch=1;
    }
  });
  if(ch)save();

  const dk=S.items.filter(a=>a&&a.dock).slice(0,4);
  const n=pageCount();
  const lib=(!editing&&S.lib)?1:0;
  page=Math.max(0,Math.min(page,n-1+lib));

  const t=$('#track');
  t.innerHTML='';
  for(let p=0;p<n;p++){
    const pg=el('div','page');
    grid().filter(a=>a.p===p).forEach(a=>{
      const x=a.type==='widget'?widget(a):slot(a,true);
      if(drag&&drag.a===a)x.style.opacity=0;
      pg.appendChild(x);
    });
    t.appendChild(pg);
  }
  if(lib)t.appendChild(libPage());

  const dc=$('#dock');dc.innerHTML='';
  dk.forEach(a=>{
    const x=slot(a);
    if(drag&&drag.a===a)x.style.opacity=0;
    dc.appendChild(x);
  });

  const ds=$('#dots');ds.innerHTML='';
  const tot=n+lib;
  if(tot>1&&page<n){
    for(let p=0;p<tot;p++){
      const b=el('button','dot'+(p===page?' on':''));
      b.onclick=()=>{page=p;render()};
      ds.appendChild(b);
    }
  }

  t.style.transition='transform .45s cubic-bezier(.22,1,.36,1)';
  t.style.transform=`translateX(${-page*100}%)`;
  setWall();

  const h=$('#home');
  h.classList.toggle('edit',editing);
  h.classList.toggle('nolabels',!S.labels||S.big);
  h.classList.toggle('st-dark',S.style==='dark');
  h.classList.toggle('st-tint',S.style==='tint');
  /* style classes on body too, so icons outside #home (folder, search popup, dialogs) match */
  document.body.classList.toggle('st-dark',S.style==='dark');
  document.body.classList.toggle('st-tint',S.style==='tint');
  h.dataset.n=n+lib;
  h.classList.toggle('inlib',!!lib&&page>=n);
  document.documentElement.style.setProperty('--tint',S.tint||'#0a84ff');
}

const setEdit=v=>{editing=v;if(!v&&$('#cs'))$('#cs').style.display='none';render()};
$('#doneb').onclick=()=>setEdit(false);
$('#spill').innerHTML='<svg viewBox="0 0 24 24" width="13" height="13"><circle cx="10" cy="10" r="6" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15 15l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Search</span>';
$('#spill').onclick=()=>{
  if(editing)return;
  const b=$('#ob');b.innerHTML='';
  b.appendChild(el('h3',0,'Quick Search & Apps'));
  const qi=el('input');qi.type='text';qi.placeholder='Search apps or enter URL / query…';
  qi.setAttribute('inputmode','search');qi.autocomplete='off';

let P=null,drag=null,edgeT=0,sx=0,sy=0,sw=false,dx=0,justDroppedAt=0;

function bindTap(n,fn,a){
  n.dataset.id=a.id;
  n.addEventListener('pointerdown',e=>{
    if(e.target.closest('.del,.sz'))return;
    moved=false;lpFired=false;clearTimeout(lp);
    P={a,x:e.clientX,y:e.clientY};
    lp=setTimeout(()=>{if(!moved&&!editing){lpFired=true;setEdit(true)}},450);
  });
  n.addEventListener('click',e=>{
    if(e.target.closest('.del,.sz'))return;
    if(Date.now()-justDroppedAt<300)return;
    if(lpFired||moved||(editing&&a.type!=='folder'))return;
    fn();
  });
}

const rm=a=>{
  if(!a)return;
  if(a.type==='folder'){
    S.items=S.items.filter(x=>x!==a);
    (a.items||[]).forEach(x=>{
      if(x){
        delete x.dock;
        S.items.push(x);
        autoPlace(x);
      }
    });
    save();render();return;
  }
  S.items=S.items.filter(x=>x!==a);
  try{localStorage.removeItem('IOS_PW_'+a.id)}catch(e){}
  save();render();
};

function slot(a,abs){

/* Weather */
const wc=c=>c<1?['Clear','sun']:c<3?['Partly Cloudy','sun']:c<4?['Cloudy','cloud']:c<50?['Fog','cloud']:c<68?['Rain','rain']:c<78?['Snow','rain']:c<83?['Showers','rain']:c<87?['Snow','rain']:['Thunderstorms','rain'];
const CL='<path d="M7 17a4 4 0 010-8 5.5 5.5 0 0110.6 1.2A3.4 3.4 0 0117 17z" fill="#fff"/>';
const wsvg=(k,s)=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}">`+(k==='sun'?'<circle cx="12" cy="12" r="5" fill="#ffd60a"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9L7 7M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1" stroke="#ffd60a" stroke-width="2" stroke-linecap="round"/>':k==='cloud'?CL:CL+'<path d="M9 19l-1 3M13 19l-1 3M17 19l-1 3" stroke="#7fc8ff" stroke-width="2" stroke-linecap="round"/>')+'</svg>';
const WBG={sun:'linear-gradient(#3d86e0,#7bb8f0)',cloud:'linear-gradient(#5f6f86,#8fa0b5)',rain:'linear-gradient(#37465f,#5b6b85)'};

function fillWx(w){
  const b=w.querySelector('.wb');
  if(!WX){w.style.background=WBG.cloud;b.innerHTML=`<div class="wc">Weather</div><div class="wd">${WXERR?'Tap to retry':'Loading…'}</div>`;return}
  const [cond,k]=wc(WX.c),d=WX.days;
  w.style.background=WBG[k];
  b.innerHTML=`<div class="wh"><div><div class="wc">${esc(WX.name)}</div><div class="wt">${WX.t}°</div></div>${wsvg(k,34)}</div><div class="wd">${cond}<br>H:${d[0].hi}° L:${d[0].lo}°</div><div class="wdays">${d.slice(0,5).map(x=>`<div><span>${x.d}</span>${wsvg(wc(x.c)[1],22)}<span>${x.hi}° ${x.lo}°</span></div>`).join('')}</div>`;
}
const paintWx=()=>document.querySelectorAll('.w.wx').forEach(fillWx);

async function loadWx(force){
  try{
    const key=(S.city||'@')+(S.f?'F':'C');let c=null;
    try{c=JSON.parse(localStorage.getItem('IOS_WX')||'null')}catch(e){}
    if(!force&&c&&c.key===key&&Date.now()-c.t<1.2e6){WX=c.d;WXERR=false;return paintWx()}
    let lat,lon,name;
    if(S.city){
      const g=await(await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&name='+encodeURIComponent(S.city))).json();
      const r=g.results[0];lat=r.latitude;lon=r.longitude;name=r.name;
    }else{
      try{
        const p=await new Promise((ok,no)=>navigator.geolocation.getCurrentPosition(ok,no,{timeout:6000,maximumAge:6e5}));
        lat=p.coords.latitude;lon=p.coords.longitude;name='My Location';
      }catch(e){
        const ip=await(await fetch('https://ipapi.co/json/')).json();
        if(!ip.latitude)throw 0;
        lat=ip.latitude;lon=ip.longitude;name=ip.city||'My Location';
      }
    }
    const j=await(await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&temperature_unit=${S.f?'fahrenheit':'celsius'}`)).json();
    WX={name,t:Math.round(j.current.temperature_2m),c:j.current.weather_code,days:j.daily.time.map((d,i)=>({d:new Date(d+'T12:00').toLocaleDateString([],{weekday:'short'}),c:j.daily.weather_code[i],hi:Math.round(j.daily.temperature_2m_max[i]),lo:Math.round(j.daily.temperature_2m_min[i])}))};
    WXERR=false;
    try{localStorage.setItem('IOS_WX',JSON.stringify({key,t:Date.now(),d:WX}))}catch(e){}
  }catch(e){if(!WX)WXERR=true}
  paintWx();
}

/* Widgets: weather, clock, calendar, search, photo */
const XT=d=>d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit',hour12:!S.h24}).replace(/\s?[AP]M/i,'');
const XS={search:'sm'};
const nextSz=a=>{const al=XS[a.kind]||'sml',i=al.indexOf(a.size||'s');return al[(i+1)%al.length]};
const MAG='<svg viewBox="0 0 24 24" width="SZ" height="SZ"><circle cx="10" cy="10" r="6" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15 15l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
function xAn(){
  const d=new Date(),h=d.getHours()%12+d.getMinutes()/60,m=d.getMinutes()+d.getSeconds()/60,s=d.getSeconds();
  let t='';for(let i=0;i<12;i++)t+=`<line x1="50" y1="${i%3?8:6}" x2="50" y2="${i%3?11:13}" transform="rotate(${i*30} 50 50)" stroke="#fff" stroke-width="${i%3?1.2:2}" opacity=".85"/>`;
  return `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="rgba(0,0,0,.35)"/>${t}<line x1="50" y1="50" x2="50" y2="27" transform="rotate(${h*30} 50 50)" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/><line x1="50" y1="50" x2="50" y2="15" transform="rotate(${m*6} 50 50)" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><line x1="50" y1="58" x2="50" y2="12" transform="rotate(${s*6} 50 50)" stroke="#ff9f0a" stroke-width="1.2" stroke-linecap="round"/><circle cx="50" cy="50" r="2.6" fill="#ff9f0a"/></svg>`;
}
function xGrid(d){
  const y=d.getFullYear(),m=d.getMonth(),f=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();
  let h='<div class="xg7">'+'SMTWTFS'.split('').map(x=>`<i class="xh">${x}</i>`).join('');
  for(let i=0;i<f;i++)h+='<i></i>';
  for(let i=1;i<=n;i++)h+=`<i${i===d.getDate()?' class="xtd"':''}>${i}</i>`;
  return h+'</div>';
}
function xPaint(a,w){
  const b=w.querySelector('.wb');if(!b)return;
  const k=a.kind,s=a.size||'s',d=new Date();
  const dow=d.toLocaleDateString([],{weekday:'long'}),mon=d.toLocaleDateString([],{month:'long'});
  let h='';
  if(k==='weather'){fillWx(w);return}
  if(k==='photo'){
    if(PH[a.id]){w.style.background=`url(${PH[a.id]}) center/cover`;b.innerHTML=''}
    else b.innerHTML='<div class="pht">Hold, then tap to add a photo</div>';
    return;
  }
  if(k==='clock'){
    const an=`<div class="xf">${xAn()}</div>`;
    h=s==='s'?an:s==='m'
      ?`<div class="xr2"><div><div class="xtime">${XT(d)}</div><div class="xsub">${dow}<br>${mon} ${d.getDate()}</div></div>${an}</div>`
      :`${an}<div class="xtime xc">${XT(d)}</div><div class="xsub xc">${dow}, ${mon} ${d.getDate()}</div>`;
  }else if(k==='calendar'){
    h=s==='s'?`<div class="xdow">${dow}</div><div class="xmid"><div class="xbig">${d.getDate()}</div></div><div class="xsub">${mon} ${d.getFullYear()}</div>`
     :s==='m'?`<div class="xr2"><div><div class="xdow">${dow}</div><div class="xbig">${d.getDate()}</div><div class="xsub">${mon}</div></div><div class="xgw">${xGrid(d)}</div></div>`
     :`<div class="xdow">${mon} ${d.getFullYear()}</div><div class="xgw l">${xGrid(d)}</div>`;
  }else if(k==='search'){
    h=s==='s'?`<div class="xmid" style="align-items:center">${MAG.replace(/SZ/g,34)}<div class="xsub">Search</div></div>`
      :`<div class="xmid"><div class="xbar">${MAG.replace(/SZ/g,16)}<span>Search the web</span></div></div>`;
  }else h='<div class="pht">Widget</div>';
  b.innerHTML=h;
}
const xAll=()=>document.querySelectorAll('.w.xw').forEach(w=>{const a=S.items.find(x=>x.id===w.dataset.id);if(a)xPaint(a,w)});
function xTap(a,w){
  switch(a.kind){
    case'weather':WXERR=false;paintWx();loadWx(true);break;
    case'clock':launch(sys('clock','Clock'),w);break;
    case'calendar':launch(sys('calendar','Calendar'),w);break;
    case'search':$('#spill').click();break;
  }
}
function widget(a){
  const sz=a.size||'s',k=a.kind||'weather';
  const w=el('div','w xw '+sz+(k==='weather'?' wx':'')+' k-'+k),b=el('div','wb');
  w.dataset.k=k;w.appendChild(b);xPaint(a,w);

  const z=el('button','sz',sz.toUpperCase());
  z.onclick=e=>{
    e.stopPropagation();
    a.size=nextSz(a);const [nw,nh]=SZ[a.size];
    a.c=Math.min(a.c,4-nw);a.r=Math.min(a.r,Math.max(0,M.rows-nh));
    grid().filter(x=>x!==a&&x.p===a.p&&x.type!=='widget'&&x.c<a.c+nw&&x.c+1>a.c&&x.r<a.r+nh&&x.r+1>a.r).sort((m,n)=>(m.r-n.r)||(m.c-n.c)).forEach(x=>autoPlace(x,a.p));
    if(!fits(a,a.p,a.c,a.r))autoPlace(a,a.p);
    page=a.p;save();render();
  };
  w.append(d,z);
  const [gw,gh]=SZ[sz];
  w.classList.add('it');
  Object.assign(w.style,{
    left:M.pad+a.c*M.cw+(M.cw-M.is)/2+'px',top:a.r*M.rh+'px',

  });

    fi.onclick=e=>{if(moved||lpFired)e.preventDefault()};

    w.appendChild(fi);
  }
  bindTap(w,()=>xTap(a,w),a);

setInterval(()=>{
  if(document.hidden)return;

/* Grid & Dock Dragging */
$('#pv').addEventListener('pointerdown',e=>{
  if(FP||FD)return;
  if(editing&&e.target.closest('.it'))return;
  sx=e.clientX;sy=e.clientY;sw=true;dx=0;moved=false;
});
/* long-press empty space to edit */
$('#pv').addEventListener('pointerdown',e=>{
  if(editing||e.target.closest('.it,.lib'))return;
  clearTimeout(lp);lp=setTimeout(()=>{if(!moved&&!editing)setEdit(true)},550);
});

function startDrag(a,e){
  const n=document.querySelector(`[data-id="${a.id}"]`);if(!n)return;
  const r=n.getBoundingClientRect(),g=n.cloneNode(true);
  g.classList.add('ghost');
  g.style.cssText=`position:fixed;left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;margin:0;z-index:60;pointer-events:none;animation:none;transform:scale(1.1);opacity:.96`;
  $('#home').appendChild(g);
  drag={a,g,ox:e.clientX-r.left,oy:e.clientY-r.top,hov:null,hs:0};
  moved=true;n.style.opacity=0;
}

function dragMove(e){
  const d=drag;
  d.g.style.left=e.clientX-d.ox+'px';
  d.g.style.top=e.clientY-d.oy+'px';
  const pr=$('#pv').getBoundingClientRect();
  const hc=Math.floor((e.clientX-d.ox-pr.left-M.pad+M.cw/2)/M.cw);
  const hr=Math.floor((e.clientY-d.oy-pr.top+M.rh/2)/M.rh);
  const ht=(d.a.type==='widget'||d.a.type==='folder')?null:grid().find(b=>b!==d.a&&b.p===page&&b.type!=='widget'&&b.c===hc&&b.r===hr);
  const hid=ht?ht.id:null;
  if(hid!==d.hov){
    d.hov=hid;d.hs=Date.now();
    document.querySelectorAll('.tgt').forEach(n=>n.classList.remove('tgt'));
    if(ht){const n=document.querySelector(`[data-id="${hid}"]`);if(n)n.classList.add('tgt')}
  }
  const near=e.clientX<28?-1:e.clientX>innerWidth-28?1:0;
  if(near&&!edgeT)edgeT=setTimeout(()=>{edgeT=0;const np=page+near;if(drag&&np>=0&&np<pageCount()){page=np;render()}},650);
  else if(!near&&edgeT){clearTimeout(edgeT);edgeT=0}
}

function endDrag(e){
  const d=drag,a=d.a;
  const gr=d.g.getBoundingClientRect();
  drag=null;clearTimeout(edgeT);edgeT=0;d.g.remove();
  document.querySelectorAll('.tgt').forEach(n=>n.classList.remove('tgt'));
  justDroppedAt=Date.now();

  const pv=$('#pv').getBoundingClientRect(),dk=$('#dock').getBoundingClientRect(),cx=e.clientX,cy=e.clientY;
  if(cy>dk.top-10&&a.type!=='widget'&&a.type!=='folder'&&(a.dock||S.items.filter(x=>x&&x.dock).length<4)){
    const col=Math.max(0,Math.min(3,Math.floor((cx-dk.left)/(dk.width/4))));
    S.items=S.items.filter(x=>x!==a);
    a.dock=true;delete a.p;delete a.c;delete a.r;
    const before=S.items.filter(x=>x&&x.dock)[col];
    S.items.splice(before?S.items.indexOf(before):S.items.length,0,a);
  }else{
    const gx=cx-d.ox-pv.left-M.pad+M.cw/2,gy=cy-d.oy-pv.top+M.rh/2;
    const tc=Math.floor(gx/M.cw),tr=Math.floor(gy/M.rh);
    const tg=(a.type==='widget'||a.type==='folder')?null:grid().find(b=>b!==a&&b.p===page&&b.type!=='widget'&&b.c===tc&&b.r===tr);
    if(tg&&d.hov===tg.id&&Date.now()-d.hs>260){
      S.items=S.items.filter(x=>x!==a);
      delete a.dock;delete a.p;delete a.c;delete a.r;
      if(tg.type==='folder'){
        if(!Array.isArray(tg.items))tg.items=[];
        tg.items.push(a);
      }else{
        const idx=S.items.indexOf(tg);
        const f={id:uid('f'),type:'folder',name:'Folder',items:[tg,a],p:tg.p,c:tg.c,r:tg.r};
        delete tg.dock;delete tg.p;delete tg.c;delete tg.r;
        if(idx>=0)S.items[idx]=f;
        else S.items.push(f);
      }
      save();render();return;
    }
    const wi=a.type==='widget',[w,h]=dm(a);
    const gl=cx-d.ox-pv.left-M.pad-(wi?(M.cw-M.is)/2:0);
    const gt=cy-d.oy-pv.top;
    const c=Math.max(0,Math.min(4-w,Math.round(gl/M.cw)));
    const r=Math.max(0,Math.min(M.rows-h,Math.round(gt/M.rh)));
    const prevP=a.p,prevC=a.c,prevR=a.r,was=a.dock;
    a.dock=false;
    const nearest=()=>{
      let best=null,bestD=1e9;
      for(let dr=0;dr<=M.rows-h;dr++){
        for(let dc=0;dc<=4-w;dc++){
          if(fits(a,page,dc,dr)){
            const dist=Math.hypot(dc-c,dr-r);
            if(dist<bestD){bestD=dist;best={dc,dr}}
          }
        }
      }
      if(best){a.p=page;a.c=best.dc;a.r=best.dr}
      else if(was||prevP!==page)autoPlace(a);
      else{a.p=prevP;a.c=prevC;a.r=prevR}
    };
    if(wi){
      /* can only take this spot if no other widget is in the way */
      const blocked=grid().some(b=>{
        if(b===a||b.p!==page||b.type!=='widget')return false;
        const [bw,bh]=dm(b);
        return c<b.c+bw&&b.c<c+w&&r<b.r+bh&&b.r<r+h;
      });
      if(blocked)nearest();
      else{
        a.p=page;a.c=c;a.r=r;
        const dis=grid().filter(b=>b!==a&&b.p===page&&b.type!=='widget'&&b.c<c+w&&b.c+1>c&&b.r<r+h&&b.r+1>r);
        dis.sort((m,n)=>(m.r-n.r)||(m.c-n.c)).forEach(b=>{
          /* push displaced icons to the nearest free cell on this page, else flow to following pages */
          let best=null,bd=1e9;
          for(let rr=0;rr<M.rows;rr++)for(let cc=0;cc<4;cc++){
            if(!fits(b,page,cc,rr))continue;
            const dist=Math.hypot(cc-b.c,rr-b.r);
            if(dist<bd){bd=dist;best={cc,rr}}
          }
          if(best){b.p=page;b.c=best.cc;b.r=best.rr}else autoPlace(b,page+1);
        });
        if(!fits(a,a.p,a.c,a.r))nearest();
      }
    }else if(fits(a,page,c,r)){a.p=page;a.c=c;a.r=r}
    else nearest();
  }
  save();render();
  /* glide the dropped item into place */
  const n=document.querySelector(`[data-id="${a.id}"]`);
  if(n){
    const r=n.getBoundingClientRect();
    const mx=gr.left+gr.width/2-(r.left+r.width/2),my=gr.top+gr.height/2-(r.top+r.height/2);
    if(Math.abs(mx)+Math.abs(my)>=3)n.animate([{transform:`translate(${mx}px,${my}px) scale(1.1)`},{transform:'translate(0,0) scale(1)'}],{duration:340,easing:'cubic-bezier(.2,.9,.25,1)'});
  }
}

window.addEventListener('pointermove',e=>{
  if(FP||FD)return;
  if(P&&editing&&!drag&&Math.hypot(e.clientX-P.x,e.clientY-P.y)>12){clearTimeout(lp);startDrag(P.a,e)}
  if(drag)return dragMove(e);
  if(!sw)return;dx=e.clientX-sx;
  if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(e.clientY-sy)){
    moved=true;clearTimeout(lp);

    t.style.transition='none';
    t.style.transform=`translateX(${Math.max(-(n-1)*w-40,Math.min(40,-page*w+dx))}px)`;

});

    const w=$('#pv').clientWidth,n=+$('#home').dataset.n||1;

/* Folders */
let FP=null,FD=null,fOpen=null,FDT=0;
const foOrigin=f=>{
  const ic=f&&document.querySelector(`[data-id="${f.id}"] .icon`),p=$('#fp');
  if(!ic||!p)return;
  const r=ic.getBoundingClientRect(),pr=p.getBoundingClientRect();
  p.style.transformOrigin=`${r.left+r.width/2-pr.left}px ${r.top+r.height/2-pr.top}px`;
};
function closeFo(){
  const o=$('#fo'),p=$('#fp');if(!o||o.dataset.c)return;
  o.dataset.c='1';foOrigin(fOpen);
  p.style.animation='xfout .24s cubic-bezier(.4,0,1,1) forwards';
  o.style.transition='opacity .24s';o.style.opacity='0';
  setTimeout(()=>{
    o.style.display='none';o.style.opacity='';o.style.transition='';p.style.animation='';
    delete o.dataset.c;fOpen=null;render();
  },250);
}
function openFolder(f){
  if(!f||!Array.isArray(f.items))return;
  let o=$('#fo');
  const was=!!o&&o.style.display==='flex';
  if(!o){
    o=el('div');o.id='fo';
    o.innerHTML='<input type="text" id="fn"><div id="fp"></div>';
    document.body.appendChild(o);
  }
  o.onclick=e=>{if(e.target===o)closeFo()};
  fOpen=f;
  const n=$('#fn');n.value=f.name||'Folder';n.readOnly=!editing;
  n.onchange=()=>{f.name=n.value.trim()||'Folder';save();render()};
  const p=$('#fp');p.innerHTML='';
  f.items.forEach(a=>{
    const sl=el('div','slot'),ic=el('div','icon');fillIcon(ic,a);
    sl.append(ic,el('span','label',a.name));
    sl.addEventListener('pointerdown',e=>{
      e.stopPropagation();
      FP={a,x:e.clientX,y:e.clientY,s:sl};
    });
    sl.addEventListener('click',e=>{
      e.stopPropagation();
      if(Date.now()-FDT<400)return;
      const fi=document.querySelector(`[data-id="${f.id}"] .icon`);
      o.style.display='none';fOpen=null;
      launch(a,fi||ic);
    });
    p.appendChild(sl);
  });
  o.style.display='flex';
  if(!was){
    delete o.dataset.c;o.style.opacity='';
    foOrigin(f);
    p.style.animation='none';p.offsetWidth;p.style.animation='';
  }
}

window.addEventListener('pointermove',e=>{
  if(FP&&!FD&&Math.hypot(e.clientX-FP.x,e.clientY-FP.y)>8){
    const r=FP.s.getBoundingClientRect(),g=FP.s.cloneNode(true);
    g.style.cssText=`position:fixed;left:${r.left}px;top:${r.top}px;width:${r.width}px;margin:0;z-index:95;pointer-events:none;transform:scale(1.1)`;
    $('#fo').appendChild(g);
    FD={a:FP.a,g,ox:FP.x-r.left,oy:FP.y-r.top};FP.s.style.opacity=0;
  }
  if(FD){FD.g.style.left=e.clientX-FD.ox+'px';FD.g.style.top=e.clientY-FD.oy+'px'}
});

window.addEventListener('pointerup',e=>{
  if(!FD){FP=null;return}
  const d=FD,f=fOpen,a=d.a,pr=$('#fp').getBoundingClientRect();
  FD=null;FP=null;FDT=Date.now();d.g.remove();
  if(!f){return}
  if(e.clientY>pr.top&&e.clientY<pr.bottom&&e.clientX>pr.left&&e.clientX<pr.right){openFolder(f);return}
  f.items=f.items.filter(x=>x!==a);
  $('#fo').style.display='none';fOpen=null;
  const fIdx=S.items.indexOf(f);
  const fPos={p:f.p,c:f.c,r:f.r};
  if(f.items.length<2){
    S.items=S.items.filter(x=>x!==f);
  }
  const pv=$('#pv').getBoundingClientRect();
  const c=Math.max(0,Math.min(3,Math.floor((e.clientX-pv.left-M.pad)/M.cw)));
  const r=Math.max(0,Math.min(M.rows-1,Math.floor((e.clientY-pv.top)/M.rh)));
  delete a.dock;
  if(fits(a,page,c,r)){a.p=page;a.c=c;a.r=r}else autoPlace(a);
  S.items.push(a);
  if(f.items.length<2){
    f.items.forEach(x=>{
      delete x.dock;
      x.p=fPos.p;x.c=fPos.c;x.r=fPos.r;
      if(!fits(x,x.p,x.c,x.r))autoPlace(x);
      if(fIdx>=0)S.items.splice(fIdx,0,x);
      else S.items.push(x);
    });
  }
  save();render();
});

/* App Launch Animation */
let webWasHidden=false;
function openUrl(u){
  let winRef=null;
  try{winRef=window.open(u,'_blank','noopener,noreferrer')}catch(e){}
  if(!winRef){
    try{winRef=window.open(u,'_blank')}catch(e){}
  }
  if(winRef){
    try{winRef.opener=null}catch(e){}
  }
  pendingWeb=true;
  webWasHidden=false;
  webLaunchTime=Date.now();
  return true;
}

function launch(a,src){
  const seq=++launchSeq;
  /* wide / offscreen sources (search pill, wide widgets, folders on other pages) animate from a clean square */
  let r=src&&src.getBoundingClientRect?src.getBoundingClientRect():null;
  const bad=!r||!r.width||r.right<0||r.left>innerWidth||r.bottom<0||r.top>innerHeight;
  const asp=r?r.width/Math.max(1,r.height):1;
  if(bad||asp>1.35||asp<.74){
    const cx=bad?innerWidth/2:r.left+r.width/2,cy=bad?innerHeight/2:r.top+r.height/2;
    const q=bad?64:Math.max(56,Math.min(r.width,r.height,76));
    r={left:cx-q/2,top:cy-q/2,width:q,height:q};
  }
  const w=$('#win'),v=$('#view');
  openRect=r;
  pendingWeb=false;
  webWasHidden=false;

  if(a.type==='url'&&a.url&&!S.proxy&&a.type!=='settings'){
    w.classList.remove('sys-open');
    v.innerHTML='';
    v.style.cssText='padding:0;overflow:hidden;background:var(--sheet)';
    const splash=el('div','blank-app');
    const grad=el('div','fs-grad');
    grad.style.background=bg(a);
    splash.appendChild(grad);

    const status=el('div','fs-status');
    const bsub=el('div',0,'Opening…');
    status.appendChild(bsub);
    splash.appendChild(status);
    v.appendChild(splash);

    const setFsImg=(src)=>{
      if(!src||!splash.isConnected)return;
      const im=new Image();
      im.className='fs-img';
      im.onload=()=>{
        if(!splash.isConnected)return;
        splash.querySelectorAll('.fs-img').forEach(x=>x.remove());
        splash.insertBefore(im,status);
      };
      im.src=src;
    };
    const domSlot=document.querySelector(`[data-id="${a.id}"] .icon`);
    if(a.icon)setFsImg(a.icon);
    else if(domSlot&&domSlot.dataset.resolvedIcon)setFsImg(domSlot.dataset.resolvedIcon);
    else{
      let host='';
      try{host=new URL(a.url).hostname}catch(e){}
      if(host){
        setFsImg(`https://www.google.com/s2/favicons?sz=256&domain=${encodeURIComponent(host)}`);
        fetchAppStoreArtwork(a.name,host,art=>setFsImg(art));
      }
    }

    v.scrollTop=0;
    v.classList.remove('show');

    Object.assign(w.style,{
      display:'block',transition:'none',transform:'',
      left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px',
      borderRadius:'22.5%',background:bg(a)
    });
    w.offsetWidth;
    Object.assign(w.style,{
      transition:'all .45s cubic-bezier(.32,.72,0,1)',
      left:'0',top:'0',width:'100vw',height:'100%',borderRadius:'0'
    });
    $('#home').classList.add('opn');
    $('#wall').classList.add('opn');
    setTimeout(()=>v.classList.add('show'),120);

    setTimeout(()=>{
      if(seq!==launchSeq||w.style.display!=='block')return;
      const d=dest(a.url);
      if(d){
        openUrl(d);
        bsub.textContent='Return here to close';
        const btn=el('button','btn','Open '+a.name);
        btn.style.maxWidth='240px';
        btn.onclick=e=>{e.stopPropagation();openUrl(d)};
        status.appendChild(btn);
        splash.onclick=()=>closeApp();
      }
    },460);
    return;
  }

  w.classList.add('sys-open');
  buildView(a,v);
  v.scrollTop=0;
  v.classList.remove('show');
  Object.assign(w.style,{
    display:'block',transition:'none',transform:'',
    left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px',
    borderRadius:'22.5%',background:a.type==='calendar'?'#fff':ART[a.type]?ART[a.type].b:bg(a)
  });
  w.offsetWidth;
  Object.assign(w.style,{
    transition:'all .46s cubic-bezier(.32,.72,0,1)',
    left:'0',top:'0',width:'100vw',height:'100%',borderRadius:'0'
  });
  $('#home').classList.add('opn');
  $('#wall').classList.add('opn');
  setTimeout(()=>v.classList.add('show'),150);
}

function closeApp(){
  launchSeq++;
  const w=$('#win');
  if(w.style.display!=='block')return;
  w.classList.remove('sys-open');
  clearInterval(swInt);
  pendingWeb=false;
  $('#view').classList.remove('show');
  const r=openRect||{left:innerWidth/2-32,top:innerHeight/2-32,width:64,height:64};
  Object.assign(w.style,{
    transition:'all .45s cubic-bezier(.32,.72,0,1)',
    transform:'',
    left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px',
    borderRadius:'22.5%'
  });
  $('#home').classList.remove('opn');
  $('#wall').classList.remove('opn');
  setTimeout(()=>{
    if(!$('#home').classList.contains('opn')){
      w.style.display='none';
      $('#view').innerHTML='';
    }
  },430);
  setTimeout(xAll,480);
}

function backFromWeb(){

/* Built-in App Views */
const BLOCK=/(^|\.)(google\.com|youtube\.com|youtu\.be|github\.com|reddit\.com|facebook\.com|instagram\.com|x\.com|twitter\.com|linkedin\.com|netflix\.com|amazon\.com|discord\.com|tiktok\.com|twitch\.tv|spotify\.com|bing\.com|chatgpt\.com|claude\.ai)$/;
const useWin=d=>{
  const m=S.openMode||'auto';
  let h='';try{h=new URL(d).hostname}catch(e){}
  return m==='win'||(m==='auto'&&BLOCK.test(h));
};
const dest=v=>{
  v=(v||'').trim();if(!v)return null;
  if(v.includes('.')&&!v.includes(' '))return /^https?:/i.test(v)?v:'https://'+v;
  return({
    duck:'https://html.duckduckgo.com/html/?q=',
    bing:'https://www.bing.com/search?q=',
    wiki:'https://en.wikipedia.org/w/index.php?search=',
    google:'https://www.google.com/search?igu=1&q='
  }[S.engine]||'https://html.duckduckgo.com/html/?q=')+encodeURIComponent(v);
};

function buildView(a,v){
  v.innerHTML='';v.style.cssText='';clearInterval(swInt);
  const T=(a.name&&a.name.trim().toLowerCase()==='settings'&&!a.url)?'settings':a.type;
  if(T==='settings')return settingsView(v);
  if(T==='safari')return webView(v,a);
  if(T==='calc'){
    let cur='0',acc=null,op=null,fresh=false;
    const f=(x,y,o)=>o=='+'?x+y:o=='−'?x-y:o=='×'?x*y:y?x/y:NaN;
    const disp=el('div','disp','0'),g=el('div','calc');
    const press=k=>{
      if(/\d/.test(k)){cur=(fresh||cur==='0')?k:cur+k;fresh=false}
      else if(k=='.'){if(fresh){cur='0.';fresh=false}else if(!cur.includes('.'))cur+='.'}
      else if(k=='AC'){cur='0';acc=op=null}
      else if(k=='±')cur=String(-cur);
      else if(k=='%')cur=String(cur/100);
      else{if(op&&!fresh){acc=f(acc,+cur,op);cur=String(+acc.toPrecision(10))}else acc=+cur;op=k=='='?null:k;fresh=true}
      disp.textContent=cur.length>9?(+cur).toExponential(3):cur;
      disp.style.fontSize=cur.length>6?'44px':'64px';
    };
    ['AC','±','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','='].forEach(k=>{
      const b=el('button',['AC','±','%'].includes(k)?'f':'÷×−+='.includes(k)?'o':k=='0'?'z':'',k);
      b.onclick=()=>press(k);g.appendChild(b);
    });
    v.style.background='#000';v.style.color='#fff';v.append(disp,g);return;
  }
  if(T==='notes'){
    v.appendChild(el('h1',0,'Notes'));
    const t=el('textarea');t.placeholder='Start typing…';t.value=S.notes||'';
    t.oninput=()=>{S.notes=t.value;save()};
    v.appendChild(t);return;
  }
  if(T==='clock'){
    v.appendChild(el('h1',0,'Clock'));
    const big=el('div','big'),sw=el('div','big');sw.style.fontSize='48px';
    let run=false,t0=0,acc=0;
    const fmt=ms=>{
      const c=Math.floor(ms/10)%100,s=Math.floor(ms/1000)%60,m=Math.floor(ms/60000),p=n=>String(n).padStart(2,'0');
      return`${p(m)}:${p(s)}.${p(c)}`;
    };
    const tk=()=>{
      big.textContent=new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit',second:'2-digit',hour12:!S.h24});
      sw.textContent=fmt(acc+(run?Date.now()-t0:0));
    };
    tk();swInt=setInterval(tk,50);
    v.append(big,el('h4',0,'Stopwatch'),sw);
    const b1=el('button','btn','Start'),b2=el('button','btn gray','Reset');
    b1.onclick=()=>{if(run){acc+=Date.now()-t0;run=false;b1.textContent='Start'}else{t0=Date.now();run=true;b1.textContent='Stop'}};
    b2.onclick=()=>{run=false;acc=0;b1.textContent='Start'};
    v.append(b1,b2);return;
  }
  if(T==='calendar'){
    const d=new Date(),y=d.getFullYear(),m=d.getMonth();
    v.appendChild(el('h1',0,d.toLocaleDateString([],{month:'long',year:'numeric'})));
    const g=el('div','cg');['S','M','T','W','T','F','S'].forEach(x=>g.appendChild(el('span','h',x)));
    for(let i=0;i<new Date(y,m,1).getDay();i++)g.appendChild(el('span'));
    for(let i=1;i<=new Date(y,m+1,0).getDate();i++)g.appendChild(el('span',i===d.getDate()?'t':'',i));
    v.appendChild(g);return;
  }
  webView(v,a);
}

function webView(v,a){
  v.style.cssText='padding:0 0 18px;overflow:hidden;display:flex;flex-direction:column';
  const top=el('div','wtop'),i=el('input'),wrap=el('div','wb2'),f=document.createElement('iframe'),ph=el('div','wph');
  i.type='text';i.placeholder='Search or enter website';i.setAttribute('inputmode','url');i.autocapitalize='off';i.autocomplete='off';

  };

    const d=dest(u);if(!d)return;cur=d;i.value=d;

  wrap.append(f,ph);v.append(top,wrap);

function shrink(e,max,cb){
  const f=e.target.files[0];if(!f)return;
  max=Math.min(max,max>=1500?1280:800);

  im.onload=()=>{
    const k=Math.min(1,max/Math.max(im.width,im.height));
    const cv=document.createElement('canvas');cv.width=im.width*k;cv.height=im.height*k;
    cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
    URL.revokeObjectURL(u);
    cb(cv.toDataURL('image/jpeg',.85));
  };
  im.src=u;e.target.value='';
}

async function hash(c){
  try{
    const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('ios:'+c));
    return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
  }catch(e){return btoa('ios:'+c)}
}
const L=['','ABC','DEF','GHI','JKL','MNO','PQRS','TUV','WXYZ'];
let buf='',padFn=null,busy=false;
(function(){
  const k=$('#keys');
  [1,2,3,4,5,6,7,8,9,'x',0,'c'].forEach(n=>{
    const b=el('button',n==='x'?'e':n==='c'?'t':'');
    if(typeof n==='number'){
      b.appendChild(document.createTextNode(n));
      b.appendChild(el('small',0,n>1?L[n-1]:''));
      b.onclick=()=>key(String(n));
    }else if(n==='c'){
      b.id='pc';b.textContent='Cancel';
      b.onclick=()=>{if(buf){buf='';dots()}else $('#pad').classList.remove('show')};
    }
    k.appendChild(b);
  });
})();
const dots=()=>{[...$('#pd').children].forEach((d,i)=>d.classList.toggle('f',i<buf.length));$('#pc').textContent=buf?'Delete':'Cancel'};
async function key(d){
  if(busy||buf.length>=4)return;buf+=d;dots();if(buf.length<4)return;
  busy=true;const c=buf;await new Promise(r=>setTimeout(r,120));
  const r=await padFn(c);buf='';busy=false;
  if(r===true){$('#pad').classList.remove('show');dots();return}
  if(typeof r==='string')$('#pt').textContent=r;
  else{
    $('#pt').textContent='Try Again';
    const p=$('#pd');p.classList.remove('shake');p.offsetWidth;p.classList.add('shake');
    if(navigator.vibrate)navigator.vibrate(200);
  }
  dots();
}
function askPass(title,fn){buf='';padFn=fn;$('#pt').textContent=title;dots();$('#pad').classList.add('show')}
function setPass(done){
  let first=null;
  askPass('Enter a New Passcode',async c=>{
    if(!first){first=c;return'Re-enter your new Passcode'}
    if(c!==first){first=null;return'Passcodes did not match. Try again'}
    S.pass=await hash(c);save();if(done)done();return true;
  });
}

const lk=$('#lock');

}
function unlock(){
  lk.style.transition='transform .52s cubic-bezier(.22,1,.36,1),opacity .42s ease';
  lk.style.transform='';lk.style.opacity='';
  lk.classList.add('up');
  $('#home').classList.remove('away');$('#wall').classList.remove('away');
  setTimeout(()=>{lk.classList.remove('show');lk.classList.remove('up');lk.style.transform='';lk.style.opacity=''},520);
}
function tryUnlock(){
  if(!S.pass)return unlock();
  askPass('Enter Passcode',async c=>{if((await hash(c))!==S.pass)return false;unlock();return true});
}
(function(){
  let lx=0,ly=0,lDrag=false,lMoved=false;
  lk.addEventListener('pointerdown',e=>{
    if($('#pad').classList.contains('show'))return;
    lx=e.clientX;ly=e.clientY;lDrag=true;lMoved=false;
    lk.style.transition='none';
  });
  lk.addEventListener('pointermove',e=>{
    if(!lDrag||$('#pad').classList.contains('show'))return;
    const dy=Math.min(0,e.clientY-ly);
    if(Math.abs(dy)>8||Math.abs(e.clientX-lx)>10)lMoved=true;
    if(dy<0){
      const prog=Math.min(1,Math.abs(dy)/220);
      lk.style.transform=`translateY(${dy}px) scale(${1+prog*.03})`;
      lk.style.opacity=String(Math.max(0,1-prog*.85));
    }
  });
  const endLockDrag=e=>{
    if(!lDrag)return;lDrag=false;
    const dy=(e&&typeof e.clientY==='number')?(e.clientY-ly):0;
    lk.style.transition='transform .52s cubic-bezier(.22,1,.36,1),opacity .42s ease';
    if(dy<-90){
      tryUnlock();
      lk.style.transform='';lk.style.opacity='';
    }else{
      lk.style.transform='';lk.style.opacity='';
    }
  };
  lk.addEventListener('pointerup',endLockDrag);
  lk.addEventListener('pointercancel',endLockDrag);
  lk.addEventListener('click',()=>{
    if($('#pad').classList.contains('show')||lMoved)return;
    tryUnlock();
  });
})();

(function(){
  const c=document.createElement('canvas');c.width=c.height=180;
  const x=c.getContext('2d'),g=x.createLinearGradient(0,0,0,180);
  g.addColorStop(0,'#2c5364');g.addColorStop(1,'#0f2027');
  x.fillStyle=g;x.fillRect(0,0,180,180);
  [[['#ff5f6d','#ffc371'],0,0],[['#56ab2f','#a8e063'],1,0],[['#4776e6','#8e54e9'],0,1],[['#f7971e','#ffd200'],1,1]].forEach(([cs,i,j])=>{
    const gg=x.createLinearGradient(0,0,0,50);gg.addColorStop(0,cs[0]);gg.addColorStop(1,cs[1]);
    x.fillStyle=gg;x.beginPath();x.roundRect(28+i*66,28+j*66,58,58,14);x.fill();
  });
  const u=c.toDataURL('image/png'),l=document.createElement('link');
  l.rel='apple-touch-icon';l.href=u;document.head.appendChild(l);
  try{
    const m=document.createElement('link');m.rel='manifest';
    m.href=URL.createObjectURL(new Blob([JSON.stringify({
      name:'Home Screen',short_name:'Home',display:'standalone',orientation:'portrait',
      start_url:location.href.split('#')[0],background_color:'#000000',theme_color:'#000000',
      icons:[{src:u,sizes:'180x180',type:'image/png'}]
    })],{type:'application/manifest+json'}));
    document.head.appendChild(m);
  }catch(e){}
})();

tick();render();

if(S.pass||S.lockStart)lockNow();
